<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sikop Digital - Pendaftaran Online & Portal</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Supabase JS -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.5); }

        /* Konfigurasi Khusus untuk Cetak (Print) ID Card */
        @media print {
            body { margin: 0; padding: 0; background: white; }
            .print-hide { display: none !important; }
            .print-bg-white { background: white !important; backdrop-filter: none !important; position: absolute; left:0; top:0; width: 100%; height: 100%; align-items: flex-start !important; justify-content: flex-start !important; }
            .print-no-shadow { box-shadow: none !important; border-radius: 0 !important; max-width: none !important; }
            .print-p-0 { padding: 0 !important; }
            .id-card { margin: 0 !important; border-radius: 0 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            @page { size: 86mm 54mm landscape; margin: 0; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, Fragment } = React;

        // ==========================================
        // 1. KONFIGURASI SUPABASE
        // ==========================================
        const SUPABASE_URL = 'https://pbxdhyktzgmttincxfdx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_hXOz-MRO5VdWVqIxXEXqeA_m0jmdSd7';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Kategori Pengeluaran (Beban)
        const EXPENSE_CATEGORIES = [
            {
                group: 'Beban Operasional & Administrasi',
                items: ['Beban Gaji dan Honorarium Pengelola', 'Beban Insentif dan Bonus Karyawan', 'Beban Alat Tulis Kantor (ATK)', 'Beban Perlengkapan Kantor', 'Beban Listrik, Air, dan Internet', 'Beban Telepon dan Komunikasi', 'Beban Pemeliharaan Gedung', 'Beban Pemeliharaan Inventaris Kantor', 'Beban Transportasi dan Perjalanan Dinas', 'Beban Promosi dan Pemasaran', 'Beban Penyusutan Inventaris & Aset Tetap', 'Beban Amortisasi']
            },
            {
                group: 'Beban Organisasi',
                items: ['Beban Penyelenggaraan RAT (Rapat Anggota Tahunan)', 'Beban Rapat Pengurus dan Pengawas', 'Beban Pendidikan dan Pelatihan Anggota', 'Beban Pendidikan dan Pelatihan Pengurus', 'Beban Kehormatan Pengurus dan Pengawas', 'Beban Hubungan Masyarakat (Humas)']
            },
            {
                group: 'Beban Keuangan & Perkoperasian',
                items: ['Beban Bunga Pinjaman Bank', 'Beban Bunga Simpanan Berjangka Anggota', 'Beban Bunga Simpanan Sukarela Anggota', 'Beban Administrasi Bank', 'Beban Pajak Penghasilan (PPh) Koperasi', 'Beban Penyisihan Penghapusan Piutang Macet']
            },
            {
                group: 'Beban Sosial',
                items: ['Beban Dana Sosial Anggota', 'Beban Santunan dan Donasi Lingkungan']
            }
        ];

        // ==========================================
        // 2. KOMPONEN IKON
        // ==========================================
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                dashboard: <Fragment><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></Fragment>,
                users: <Fragment><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Fragment>,
                wallet: <Fragment><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"/></Fragment>,
                kredit: <Fragment><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></Fragment>,
                file: <Fragment><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></Fragment>,
                shu: <Fragment><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></Fragment>,
                plus: <Fragment><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Fragment>,
                x: <Fragment><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Fragment>,
                camera: <Fragment><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></Fragment>,
                menu: <Fragment><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></Fragment>,
                logout: <Fragment><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></Fragment>,
                user: <Fragment><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Fragment>,
                print: <Fragment><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></Fragment>,
                bell: <Fragment><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></Fragment>,
                send: <Fragment><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></Fragment>,
                check: <Fragment><polyline points="20 6 9 17 4 12"></polyline></Fragment>,
                receipt: <Fragment><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1Z"></path><path d="M16 8h-6"></path><path d="M16 12h-8"></path><path d="M16 16h-8"></path></Fragment>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        // ==========================================
        // 3. APLIKASI UTAMA
        // ==========================================
        function App() {
            // State Sesi & Autentikasi
            const [session, setSession] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [myProfile, setMyProfile] = useState(null);
            
            // State UI Login / Register
            const [isRegistering, setIsRegistering] = useState(false);
            const [loginForm, setLoginForm] = useState({ email: '', password: '' });
            const [registerForm, setRegisterForm] = useState({
                name: '', nik: '', gender: '', birthDate: '', address: '', phone: '', email: '', password: '', photoFile: null, photoPreview: null
            });
            const [authError, setAuthError] = useState('');
            const [authLoading, setAuthLoading] = useState(false);

            // State Data Aplikasi
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [showModal, setShowModal] = useState(null);
            const [printMember, setPrintMember] = useState(null);
            const [members, setMembers] = useState([]);
            const [savings, setSavings] = useState([]);
            const [financings, setFinancings] = useState([]);
            const [requests, setRequests] = useState([]);
            const [expenses, setExpenses] = useState([]); // State Pengeluaran Beban

            // State Form
            const [savingForm, setSavingForm] = useState({ memberId: '', pokok: 0, wajib: 0, sukarela: 0, cicilan: 0 });
            const [kreditForm, setKreditForm] = useState({ memberId: '', title: '', amount: 0, marginPercent: 5, tenor: 1, requestId: null });
            const [requestForm, setRequestForm] = useState({ type: 'Kredit', amount: '', tenor: 1, notes: '' });
            const [expenseForm, setExpenseForm] = useState({ category: '', amount: '', notes: '' });

            // Custom Alert & Confirm State
            const [alertMessage, setAlertMessage] = useState(null);
            const [confirmAction, setConfirmAction] = useState(null);

            // Format Uang
            const formatIDR = (val) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val || 0);

            // ==========================================
            // 4. EFEK & PENGAMBILAN DATA
            // ==========================================
            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    handleSession(session);
                });

                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    handleSession(session);
                });

                return () => subscription.unsubscribe();
            }, []);

            const handleSession = async (sessionData) => {
                setSession(sessionData);
                if (sessionData) {
                    const email = sessionData.user.email;
                    const adminCheck = email.includes('admin@');
                    setIsAdmin(adminCheck);
                    
                    if (adminCheck) {
                        setActiveTab('dashboard');
                        fetchAdminData();
                    } else {
                        setActiveTab('member_dashboard');
                        fetchMemberData(email);
                    }
                }
            };

            const fetchAdminData = async () => {
                const [memRes, savRes, finRes, reqRes, expRes] = await Promise.all([
                    supabase.from('members').select('*'),
                    supabase.from('savings').select('*'),
                    supabase.from('financings').select('*'),
                    supabase.from('requests').select('*').order('date', { ascending: false }),
                    supabase.from('expenses').select('*').order('date', { ascending: false })
                ]);
                if (memRes.data) setMembers(memRes.data);
                if (savRes.data) setSavings(savRes.data);
                if (finRes.data) setFinancings(finRes.data);
                if (reqRes.data) setRequests(reqRes.data);
                if (expRes.data) setExpenses(expRes.data);
            };

            const fetchMemberData = async (email) => {
                const { data: profile } = await supabase.from('members').select('*').eq('email', email).single();
                if (profile) {
                    setMyProfile(profile);
                    const [savRes, finRes, reqRes] = await Promise.all([
                        supabase.from('savings').select('*').eq('member_id', profile.id),
                        supabase.from('financings').select('*').eq('member_id', profile.id),
                        supabase.from('requests').select('*').eq('member_id', profile.id).order('date', { ascending: false })
                    ]);
                    if (savRes.data) setSavings(savRes.data);
                    if (finRes.data) setFinancings(finRes.data);
                    if (reqRes.data) setRequests(reqRes.data);
                } else {
                    setAuthError("Profil tidak ditemukan. Pastikan email terdaftar di database Koperasi.");
                }
            };

            // ==========================================
            // 5. FUNGSI AUTENTIKASI
            // ==========================================
            const handleLogin = async (e) => {
                e.preventDefault();
                setAuthLoading(true);
                setAuthError('');

                if (SUPABASE_URL.includes('YOUR_PROJECT_ID')) {
                    setAuthError("Koneksi Gagal: Anda belum mengganti SUPABASE_URL.");
                    setAuthLoading(false);
                    return;
                }

                const { error } = await supabase.auth.signInWithPassword(loginForm);
                if (error) setAuthError("Email atau Password salah!");
                setAuthLoading(false);
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                setAuthLoading(true);
                setAuthError('');
                
                try {
                    if (!registerForm.email || !registerForm.password || !registerForm.name || !registerForm.nik || !registerForm.birthDate) {
                        throw new Error("Semua kolom bertanda * wajib diisi!");
                    }

                    const { data: authData, error: authError } = await supabase.auth.signUp({
                        email: registerForm.email,
                        password: registerForm.password,
                    });
                    if (authError) throw authError;

                    let photoUrl = null;
                    if (registerForm.photoFile) {
                        const fileExt = registerForm.photoFile.name.split('.').pop();
                        const fileName = `public_${Math.random()}.${fileExt}`;
                        const { error: uploadErr } = await supabase.storage.from('member-photos').upload(fileName, registerForm.photoFile);
                        if (!uploadErr) {
                            const { data: pubUrl } = supabase.storage.from('member-photos').getPublicUrl(fileName);
                            photoUrl = pubUrl.publicUrl;
                        }
                    }

                    const newId = `ANG-${Math.random().toString(36).substring(2, 6).toUpperCase()}`;
                    const { error: dbError } = await supabase.from('members').insert([{
                        id: newId,
                        name: registerForm.name,
                        nik: registerForm.nik,
                        gender: registerForm.gender,
                        birth_date: registerForm.birthDate,
                        address: registerForm.address,
                        phone: registerForm.phone,
                        email: registerForm.email,
                        status: 'Aktif',
                        join_date: new Date().toISOString().split('T')[0],
                        photo_url: photoUrl
                    }]);
                    
                    if (dbError) throw dbError;

                    setAlertMessage("Pendaftaran Berhasil! Silakan Login.");
                    setIsRegistering(false);
                } catch (err) {
                    setAuthError(err.message);
                } finally {
                    setAuthLoading(false);
                }
            };

            const handleLogout = async () => {
                await supabase.auth.signOut();
                setSession(null);
                setMyProfile(null);
                setMembers([]); setSavings([]); setFinancings([]); setRequests([]); setExpenses([]);
            };

            // ==========================================
            // 6. PERHITUNGAN OTOMATIS (KEUANGAN LENGKAP)
            // ==========================================
            const memberFinancialData = useMemo(() => {
                const targetMembers = isAdmin ? members : (myProfile ? [myProfile] : []);
                return targetMembers.map(member => {
                    const mSavings = savings.filter(s => s.member_id === member.id);
                    const p = mSavings.filter(s => s.type === 'Pokok').reduce((a, b) => a + Number(b.amount), 0);
                    const w = mSavings.filter(s => s.type === 'Wajib').reduce((a, b) => a + Number(b.amount), 0);
                    const s = mSavings.filter(s => s.type === 'Sukarela').reduce((a, b) => a + Number(b.amount), 0);
                    
                    const mCredits = financings.filter(f => f.member_id === member.id);
                    const angsuran = mCredits.reduce((a, b) => a + Number(b.monthly), 0);
                    const marginContrib = mCredits.reduce((acc, curr) => acc + (Number(curr.amount) * (Number(curr.margin_percent) / 100) * Number(curr.tenor)), 0);

                    return { ...member, pokok: p, wajib: w, sukarela: s, totalSavings: p+w+s, totalAngsuran: angsuran, marginContrib };
                });
            }, [members, savings, financings, isAdmin, myProfile]);

            // Laba Rugi Calculations
            const totalPendapatan = useMemo(() => memberFinancialData.reduce((acc, curr) => acc + curr.marginContrib, 0), [memberFinancialData]);
            const totalBeban = useMemo(() => expenses.reduce((a, b) => a + Number(b.amount), 0), [expenses]);
            const labaBersih = Math.max(0, totalPendapatan - totalBeban);

            // Arus Kas Calculations
            const totalKasMasuk = useMemo(() => savings.filter(s => s.amount > 0).reduce((a, b) => a + Number(b.amount), 0), [savings]);
            const totalKasKeluarPenarikan = useMemo(() => Math.abs(savings.filter(s => s.amount < 0).reduce((a, b) => a + Number(b.amount), 0)), [savings]);
            const totalKasKeluarKredit = useMemo(() => financings.reduce((a, b) => a + Number(b.amount), 0), [financings]);
            const saldoKasAkhir = totalKasMasuk - totalKasKeluarPenarikan - totalKasKeluarKredit - totalBeban;

            const totalCoopSavings = useMemo(() => memberFinancialData.reduce((acc, curr) => acc + curr.totalSavings, 0), [memberFinancialData]);
            const myData = memberFinancialData[0] || {};
            const pendingRequestsCount = requests.filter(r => r.status === 'Menunggu').length;

            // ==========================================
            // 7. RENDER HALAMAN LOGIN / REGISTER
            // ==========================================
            if (!session) {
                return (
                    <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4 print-hide">
                        <div className={`w-full ${isRegistering ? 'max-w-4xl' : 'max-w-md'} bg-white rounded-[32px] shadow-2xl overflow-hidden animate-fade-in transition-all duration-500`}>
                            <div className="bg-blue-600 p-8 text-center text-white relative">
                                <div className="w-16 h-16 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center mx-auto mb-4 border border-white/30">
                                    <Icon name="user" size={32} />
                                </div>
                                <h1 className="text-2xl font-black tracking-tight">{isRegistering ? 'Pendaftaran Anggota' : 'Portal Koperasi'}</h1>
                                <p className="text-blue-200 text-sm mt-2">{isRegistering ? 'Isi data diri Anda dengan lengkap' : 'Silakan login untuk mengakses data Anda'}</p>
                            </div>
                            
                            <div className="p-8">
                                {authError && <div className="mb-6 p-4 bg-red-50 text-red-600 rounded-xl text-sm font-bold border border-red-100 text-center">{authError}</div>}
                                
                                {!isRegistering ? (
                                    <form onSubmit={handleLogin} className="space-y-6">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-400 uppercase mb-2">Email Akun</label>
                                            <input type="email" required className="w-full p-4 bg-slate-50 rounded-xl border focus:border-blue-500 outline-none font-bold text-slate-700" placeholder="nama@email.com" value={loginForm.email} onChange={e => setLoginForm({...loginForm, email: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-400 uppercase mb-2">Password</label>
                                            <input type="password" required className="w-full p-4 bg-slate-50 rounded-xl border focus:border-blue-500 outline-none font-bold text-slate-700" placeholder="••••••••" value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} />
                                        </div>
                                        <button type="submit" disabled={authLoading} className="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-black text-lg transition-colors shadow-lg shadow-blue-200">
                                            {authLoading ? 'Memproses...' : 'MASUK'}
                                        </button>
                                        <div className="text-center pt-4 border-t border-slate-100">
                                            <p className="text-sm text-slate-500 mb-2">Belum memiliki akun Koperasi?</p>
                                            <button type="button" onClick={() => {setIsRegistering(true); setAuthError('');}} className="text-blue-600 font-black hover:underline">Daftar Anggota Online di sini</button>
                                        </div>
                                    </form>
                                ) : (
                                    <form onSubmit={handleRegister} className="space-y-6">
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                            <div className="space-y-6">
                                                <div className="bg-slate-50 p-6 rounded-2xl border text-center">
                                                    <label className="block text-xs font-bold text-slate-400 uppercase mb-4">Foto Profil (Opsional)</label>
                                                    <div className="w-32 h-40 mx-auto bg-white border-2 border-dashed border-slate-300 rounded-xl flex flex-col items-center justify-center relative overflow-hidden group hover:border-blue-400 cursor-pointer transition-colors">
                                                        {registerForm.photoPreview ? <img src={registerForm.photoPreview} className="w-full h-full object-cover"/> : <Icon name="camera" className="text-slate-300 group-hover:text-blue-400"/>}
                                                        <input type="file" accept="image/*" className="absolute inset-0 opacity-0 cursor-pointer" onChange={(e)=>{
                                                            const file = e.target.files[0];
                                                            if(file) setRegisterForm({...registerForm, photoFile: file, photoPreview: URL.createObjectURL(file)});
                                                        }} />
                                                    </div>
                                                </div>
                                                <div className="bg-blue-50 p-5 rounded-2xl border border-blue-100">
                                                    <h4 className="text-xs font-black text-blue-800 uppercase mb-4 border-b border-blue-200 pb-2">Buat Akun Login</h4>
                                                    <input type="email" required placeholder="Email Aktif *" className="w-full p-3 mb-3 bg-white rounded-lg border outline-none text-sm" onChange={e => setRegisterForm({...registerForm, email: e.target.value})} />
                                                    <input type="password" required placeholder="Password Minimal 6 Huruf *" className="w-full p-3 bg-white rounded-lg border outline-none text-sm" onChange={e => setRegisterForm({...registerForm, password: e.target.value})} />
                                                </div>
                                            </div>
                                            
                                            <div className="md:col-span-2 space-y-4">
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="text-[10px] font-bold text-slate-500 uppercase ml-1">Nama Lengkap Sesuai KTP *</label>
                                                        <input required placeholder="Contoh: Budi Santoso" className="w-full p-3.5 bg-slate-50 rounded-xl border outline-none mt-1 font-semibold" onChange={e => setRegisterForm({...registerForm, name: e.target.value})} />
                                                    </div>
                                                    <div>
                                                        <label className="text-[10px] font-bold text-slate-500 uppercase ml-1">Nomor Induk Kependudukan (NIK) *</label>
                                                        <input required placeholder="16 Digit NIK" className="w-full p-3.5 bg-slate-50 rounded-xl border outline-none mt-1 font-mono" onChange={e => setRegisterForm({...registerForm, nik: e.target.value})} />
                                                    </div>
                                                </div>
                                                
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="text-[10px] font-bold text-slate-500 uppercase ml-1">Jenis Kelamin</label>
                                                        <select className="w-full p-3.5 bg-slate-50 rounded-xl border outline-none mt-1 font-semibold" onChange={e => setRegisterForm({...registerForm, gender: e.target.value})}>
                                                            <option value="">Pilih...</option><option value="Laki-laki">Laki-laki</option><option value="Perempuan">Perempuan</option>
                                                        </select>
                                                    </div>
                                                    <div>
                                                        <label className="text-[10px] font-bold text-slate-500 uppercase ml-1">Tanggal Lahir *</label>
                                                        <input type="date" required className="w-full p-3.5 bg-slate-50 rounded-xl border outline-none mt-1" onChange={e => setRegisterForm({...registerForm, birthDate: e.target.value})} />
                                                    </div>
                                                </div>

                                                <div>
                                                    <label className="text-[10px] font-bold text-slate-500 uppercase ml-1">Nomor HP / WhatsApp Aktif</label>
                                                    <input placeholder="Contoh: 08123456789" className="w-full p-3.5 bg-slate-50 rounded-xl border outline-none mt-1" onChange={e => setRegisterForm({...registerForm, phone: e.target.value})} />
                                                </div>

                                                <div>
                                                    <label className="text-[10px] font-bold text-slate-500 uppercase ml-1">Alamat Domisili Lengkap</label>
                                                    <textarea required placeholder="Jalan, RT/RW, Kelurahan..." className="w-full p-3.5 bg-slate-50 rounded-xl border outline-none mt-1 h-24 resize-none" onChange={e => setRegisterForm({...registerForm, address: e.target.value})}></textarea>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div className="flex flex-col md:flex-row gap-4 pt-6 border-t">
                                            <button type="button" onClick={() => {setIsRegistering(false); setAuthError('');}} className="w-full md:w-1/3 py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold transition-colors">
                                                Batal
                                            </button>
                                            <button type="submit" disabled={authLoading} className="w-full md:w-2/3 py-4 bg-green-600 hover:bg-green-700 text-white rounded-xl font-black text-lg transition-colors shadow-lg shadow-green-200">
                                                {authLoading ? 'Menyimpan Data...' : 'KIRIM PENDAFTARAN'}
                                            </button>
                                        </div>
                                    </form>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // 8. FUNGSI ADMIN & MEMBER
            // ==========================================
            const handleAddSaving = async () => {
                const date = new Date().toISOString().split('T')[0];
                const entries = [];
                if (savingForm.pokok > 0) entries.push({ member_id: savingForm.memberId, type: 'Pokok', amount: Number(savingForm.pokok), date });
                if (savingForm.wajib > 0) entries.push({ member_id: savingForm.memberId, type: 'Wajib', amount: Number(savingForm.wajib), date });
                if (savingForm.sukarela > 0) entries.push({ member_id: savingForm.memberId, type: 'Sukarela', amount: Number(savingForm.sukarela), date });
                if (savingForm.cicilan > 0) entries.push({ member_id: savingForm.memberId, type: 'Cicilan', amount: Number(savingForm.cicilan), date });
                
                if (entries.length > 0) {
                    const { error } = await supabase.from('savings').insert(entries);
                    if (!error) {
                        fetchAdminData();
                        setShowModal(null);
                        setSavingForm({ memberId: '', pokok: 0, wajib: 0, sukarela: 0, cicilan: 0 });
                    } else setAlertMessage(error.message);
                }
            };

            const handleAddExpense = async (e) => {
                e.preventDefault();
                if (!expenseForm.category || !expenseForm.amount) return setAlertMessage("Data pengeluaran tidak lengkap.");
                
                const { error } = await supabase.from('expenses').insert([{
                    category: expenseForm.category,
                    amount: expenseForm.amount,
                    notes: expenseForm.notes,
                    date: new Date().toISOString().split('T')[0]
                }]);
                
                if (!error) {
                    fetchAdminData();
                    setShowModal(null);
                    setExpenseForm({ category: '', amount: '', notes: '' });
                    setAlertMessage("Pengeluaran beban berhasil dicatat.");
                } else {
                    setAlertMessage(`Gagal: ${error.message} (Pastikan Anda sudah membuat tabel 'expenses' di Supabase)`);
                }
            };

            const calculateKredit = () => {
                const principal = Number(kreditForm.amount) || 0;
                const totalMargin = principal * (Number(kreditForm.marginPercent) / 100) * Number(kreditForm.tenor);
                const total = principal + totalMargin;
                const monthly = total / (Number(kreditForm.tenor) * 12);
                return { total, monthly: isFinite(monthly) ? monthly : 0 };
            };

            const handleAddKredit = async () => {
                const newId = `KRD-${Math.random().toString(36).substr(2,4).toUpperCase()}`;
                const { error } = await supabase.from('financings').insert([{
                    id: newId,
                    member_id: kreditForm.memberId,
                    title: kreditForm.title,
                    amount: kreditForm.amount,
                    margin_percent: kreditForm.marginPercent,
                    tenor: kreditForm.tenor,
                    monthly: calculateKredit().monthly,
                    date: new Date().toISOString().split('T')[0]
                }]);
                if (!error) {
                    if (kreditForm.requestId) {
                        await supabase.from('requests').update({ status: 'Disetujui' }).eq('id', kreditForm.requestId);
                    }
                    fetchAdminData();
                    setShowModal(null);
                    setKreditForm({ memberId: '', title: '', amount: 0, marginPercent: 5, tenor: 1, requestId: null });
                } else setAlertMessage(error.message);
            };

            const handleSubmitRequest = async (e) => {
                e.preventDefault();
                if (!requestForm.amount || requestForm.amount <= 0) return setAlertMessage("Nominal pengajuan tidak valid.");
                
                if (requestForm.type === 'Penarikan' && myData.sukarela < requestForm.amount) {
                    return setAlertMessage(`Pengajuan Gagal: Saldo Tabungan Sukarela Anda (${formatIDR(myData.sukarela)}) tidak mencukupi untuk nominal penarikan ini.`);
                }

                const { error } = await supabase.from('requests').insert([{
                    member_id: myProfile.id,
                    type: requestForm.type,
                    amount: requestForm.amount,
                    tenor: requestForm.type === 'Kredit' ? requestForm.tenor : null,
                    notes: requestForm.notes,
                    status: 'Menunggu',
                    date: new Date().toISOString().split('T')[0]
                }]);

                if (!error) {
                    setAlertMessage("Pengajuan berhasil dikirim dan sedang menunggu persetujuan pengurus.");
                    setRequestForm({ type: 'Kredit', amount: '', tenor: 1, notes: '' });
                    fetchMemberData(session.user.email);
                } else setAlertMessage(`Gagal Mengirim: ${error.message}`);
            };

            const handleApproveRequest = async (req) => {
                if (req.type === 'Penarikan') {
                    const confirmMsg = `Setujui penarikan Rp${formatIDR(req.amount)} untuk ${members.find(m => m.id === req.member_id)?.name}?`;
                    
                    setConfirmAction({
                        message: confirmMsg,
                        onConfirm: async () => {
                            const memberData = memberFinancialData.find(m => m.id === req.member_id);
                            if (memberData.sukarela < req.amount) {
                                return setAlertMessage("Gagal Disetujui: Saldo tabungan sukarela anggota sudah tidak mencukupi.");
                            }

                            const { error: saveErr } = await supabase.from('savings').insert([{
                                member_id: req.member_id, type: 'Sukarela', amount: -Math.abs(req.amount), date: new Date().toISOString().split('T')[0], notes: 'Penarikan Disetujui'
                            }]);

                            if (!saveErr) {
                                await supabase.from('requests').update({ status: 'Disetujui' }).eq('id', req.id);
                                fetchAdminData();
                            } else setAlertMessage(saveErr.message);
                        }
                    });

                } else if (req.type === 'Kredit') {
                    setKreditForm({
                        memberId: req.member_id, title: req.notes || 'Pengajuan Kredit', amount: req.amount, marginPercent: 5, tenor: req.tenor || 1, requestId: req.id
                    });
                    setShowModal('kredit');
                }
            };

            const handleRejectRequest = async (reqId) => {
                setConfirmAction({
                    message: "Yakin ingin menolak pengajuan ini?",
                    onConfirm: async () => {
                        const { error } = await supabase.from('requests').update({ status: 'Ditolak' }).eq('id', reqId);
                        if (!error) fetchAdminData();
                    }
                });
            };

            // ==========================================
            // 9. MENU & STRUKTUR UI PORTAL
            // ==========================================

                { id: 'dashboard', icon: 'dashboard', label: 'Dashboard' },
                { id: 'pengajuan', icon: 'bell', label: 'Pengajuan', badge: pendingRequestsCount },
                { id: 'anggota', icon: 'users', label: 'Anggota' },
                { id: 'kas', icon: 'wallet', label: 'Setoran Kas' },
                { id: 'kredit', icon: 'kredit', label: 'Kredit' },
                { id: 'pengeluaran', icon: 'receipt', label: 'Pengeluaran' },
                { id: 'laporan', icon: 'file', label: 'Laporan & Kas' },
                { id: 'shu', icon: 'shu', label: 'SHU' }

            const memberMenu = [

                            <p className="font-bold text-sm text-slate-700 truncate">{isAdmin ? 'Administrator' : (myProfile?.name || 'Anggota')}</p>
                            <p className="text-[10px] text-slate-500 truncate">{session?.user?.email}</p>
                        </div>

                        <nav className="space-y-2 flex-1 overflow-y-auto custom-scrollbar pr-2">
                            {menuToRender.map(item => (
                                <button key={item.id} onClick={() => { setActiveTab(item.id); setIsSidebarOpen(false); }} className={`w-full flex items-center justify-between px-4 py-3.5 rounded-xl transition-all ${activeTab === item.id ? 'bg-blue-600 text-white shadow-md shadow-blue-200' : 'text-slate-500 hover:bg-slate-50 hover:text-blue-600'}`}>

                                        <Icon name={item.icon} />

                                    </div>

                                        <span className="bg-red-500 text-white text-[10px] font-black px-2 py-0.5 rounded-full">{item.badge}</span>
                                    )}
                                </button>
                            ))}
                        </nav>
                        
                        <div className="mt-auto border-t pt-4">
                            <button onClick={handleLogout} className="w-full flex items-center justify-center space-x-2 p-3 text-red-500 hover:bg-red-50 rounded-xl font-bold transition-colors">
                                <Icon name="logout" size={18}/> <span>Keluar</span>
                            </button>
                        </div>
                    </aside>

                    {/* MAIN CONTENT AREA */}

                            </div>
                            <div className="flex items-center space-x-2 bg-white px-4 py-2 rounded-full border shadow-sm">
                                <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                                <span className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Terkoneksi</span>
                            </div>
                        </header>

                        {/* CONTENT SCROLL */}
                        <div className="print-hide flex-1 overflow-y-auto p-4 md:p-8 pb-24 md:pb-10 custom-scrollbar">
                            
                            {/* --- TAB: DASHBOARD ADMIN --- */}
                            {activeTab === 'dashboard' && isAdmin && (
                                <div className="space-y-6 animate-fade-in">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                        <div className="bg-white p-6 rounded-3xl border shadow-sm">
                                            <p className="text-xs font-bold text-slate-400 uppercase mb-2">Total Anggota</p>
                                            <h3 className="text-3xl font-black text-slate-800">{members.length}</h3>
                                        </div>
                                        <div className="bg-white p-6 rounded-3xl border shadow-sm">
                                            <p className="text-xs font-bold text-slate-400 uppercase mb-2">Saldo Kas Terakhir</p>
                                            <h3 className={`text-3xl font-black ${saldoKasAkhir >= 0 ? 'text-green-600' : 'text-red-600'}`}>{formatIDR(saldoKasAkhir)}</h3>
                                        </div>
                                        <div className="bg-white p-6 rounded-3xl border shadow-sm">
                                            <p className="text-xs font-bold text-slate-400 uppercase mb-2">Total Simpanan</p>
                                            <h3 className="text-3xl font-black text-blue-600">{formatIDR(totalCoopSavings)}</h3>
                                        </div>
                                        <div className="bg-white p-6 rounded-3xl border shadow-sm">
                                            <p className="text-xs font-bold text-slate-400 uppercase mb-2">Aset Kredit</p>
                                            <h3 className="text-3xl font-black text-orange-600">{formatIDR(financings.reduce((a,b)=>a+Number(b.amount),0))}</h3>
                                        </div>
                                    </div>
                                    <div className="bg-blue-600 p-6 md:p-8 rounded-3xl shadow-lg shadow-blue-200 text-white relative overflow-hidden">
                                        <div className="absolute -right-4 -top-4 opacity-10"><Icon name="shu" size={120}/></div>
                                        <p className="text-xs font-bold text-blue-200 uppercase mb-2">Laba Bersih / SHU Berjalan</p>
                                        <h3 className="text-4xl md:text-5xl font-black">{formatIDR(labaBersih)}</h3>
                                    </div>
                                </div>
                            )}

                            {/* --- TAB: DASHBOARD MEMBER --- */}
                            {activeTab === 'member_dashboard' && !isAdmin && (
                                myProfile ? (
                                    <div className="space-y-6 animate-fade-in">
                                        <div className="bg-gradient-to-r from-blue-700 to-blue-500 rounded-[32px] p-8 text-white shadow-xl shadow-blue-200 relative overflow-hidden">
                                            <div className="relative z-10 flex flex-col md:flex-row justify-between items-center gap-6">
                                                <div className="flex items-center space-x-6">
                                                    <div className="w-20 h-20 bg-white/20 rounded-full border-2 border-white/40 flex items-center justify-center overflow-hidden">
                                                        {myProfile.photo_url ? <img src={myProfile.photo_url} className="w-full h-full object-cover"/> : <Icon name="user" size={36}/>}
                                                    </div>
                                                    <div>
                                                        <p className="text-blue-100 text-sm font-bold uppercase tracking-wider mb-1">Kartu Anggota Digital</p>
                                                        <h2 className="text-2xl font-black">{myProfile.name}</h2>
                                                        <p className="text-blue-200 font-mono text-sm">{myProfile.id} • {myProfile.status}</p>
                                                    </div>
                                                </div>
                                                <div className="bg-white/10 backdrop-blur-md p-5 rounded-2xl border border-white/20 w-full md:w-auto text-center md:text-right">
                                                    <p className="text-xs font-bold text-blue-200 uppercase mb-1">Total Tabungan Anda</p>
                                                    <p className="text-3xl font-black text-white">{formatIDR(myData.totalSavings)}</p>
                                                </div>
                                            </div>
                                            
                                            <div className="mt-6 flex justify-center md:justify-start relative z-10">
                                                <button onClick={() => setPrintMember(myProfile)} className="bg-white/20 hover:bg-white/30 border border-white/30 backdrop-blur-md text-white px-6 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-colors text-sm shadow-sm">
                                                    <Icon name="print" size={18}/> Cetak Fisik ID Card
                                                </button>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            <div className="bg-white rounded-3xl p-6 border shadow-sm">
                                                <h3 className="font-black text-slate-800 mb-6 border-b pb-4 flex items-center"><Icon name="wallet" className="mr-2 text-green-500"/> Rincian Tabungan</h3>
                                                <div className="space-y-4">
                                                    <div className="flex justify-between items-center"><span className="text-sm font-bold text-slate-500">Simpanan Pokok</span><span className="font-black text-slate-800">{formatIDR(myData.pokok)}</span></div>
                                                    <div className="flex justify-between items-center"><span className="text-sm font-bold text-slate-500">Simpanan Wajib</span><span className="font-black text-slate-800">{formatIDR(myData.wajib)}</span></div>
                                                    <div className="flex justify-between items-center"><span className="text-sm font-bold text-slate-500">Simpanan Sukarela</span><span className="font-black text-slate-800">{formatIDR(myData.sukarela)}</span></div>
                                                </div>
                                            </div>
                                            <div className="bg-white rounded-3xl p-6 border shadow-sm">
                                                <h3 className="font-black text-slate-800 mb-6 border-b pb-4 flex items-center"><Icon name="kredit" className="mr-2 text-orange-500"/> Kewajiban Kredit</h3>
                                                <div className="flex justify-between items-center p-4 bg-orange-50 rounded-2xl border border-orange-100">
                                                    <span className="text-sm font-bold text-orange-800">Total Angsuran Bulan Ini</span>
                                                    <span className="text-xl font-black text-orange-600">{formatIDR(myData.totalAngsuran)}</span>
                                                </div>
                                                <p className="text-xs text-slate-400 mt-4 text-center">Silakan lakukan pembayaran ke rekening koperasi sebelum tanggal 10.</p>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="flex flex-col items-center justify-center h-[60vh] text-center animate-fade-in bg-white rounded-3xl border shadow-sm p-8">
                                        <div className="w-20 h-20 bg-red-50 text-red-500 rounded-full flex items-center justify-center mb-6">
                                            <Icon name="user" size={40} />
                                        </div>
                                        <h3 className="text-2xl font-black text-slate-800 mb-2">Profil Tidak Ditemukan</h3>
                                        <p className="text-slate-500 max-w-md">

                                        </p>
                                    </div>
                                )
                            )}

                            {/* --- TAB: PENGAJUAN MEMBER --- */}
                            {activeTab === 'member_pengajuan' && !isAdmin && myProfile && (
                                <div className="space-y-6 animate-fade-in">
                                    <div className="bg-white rounded-3xl border shadow-sm p-6 md:p-8">
                                        <h4 className="font-black text-slate-800 mb-6 border-b pb-4 flex items-center"><Icon name="send" className="mr-3 text-blue-500"/> Buat Pengajuan Baru</h4>
                                        <form onSubmit={handleSubmitRequest} className="space-y-5 max-w-2xl">
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 uppercase mb-2 block">Jenis Pengajuan</label>
                                                <select className="w-full p-4 bg-slate-50 rounded-xl border focus:border-blue-500 outline-none font-bold text-slate-700" value={requestForm.type} onChange={(e)=>setRequestForm({...requestForm, type: e.target.value})}>
                                                    <option value="Kredit">Pengajuan Pembiayaan (Kredit)</option>
                                                    <option value="Penarikan">Penarikan Tabungan Sukarela</option>
                                                </select>
                                                {requestForm.type === 'Penarikan' && (
                                                    <p className="text-[10px] font-bold text-orange-500 mt-2">*Saldo Sukarela Anda saat ini: {formatIDR(myData.sukarela)}</p>

                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

                                                            const totalTerima = jasaSimpanan + jasaAnggota;
                                                            return (
                                                                <tr key={m.id} className="hover:bg-slate-50 text-sm">
                                                                    <td className="px-4 py-3 font-bold text-slate-700">{m.name} <span className="block text-[10px] text-slate-400 font-mono font-normal">{m.id}</span></td>
                                                                    <td className="px-4 py-3 text-right font-mono text-slate-500">{formatIDR(jasaSimpanan)}</td>
                                                                    <td className="px-4 py-3 text-right font-mono text-slate-500">{formatIDR(jasaAnggota)}</td>
                                                                    <td className="px-4 py-3 text-right font-black text-blue-600 bg-blue-50/30">{formatIDR(totalTerima)}</td>
                                                                </tr>
                                                            );
                                                        })}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>

                    {/* MODAL SIMPANAN (ADMIN) */}
                    {showModal === 'saving' && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 print-hide">
                            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={() => setShowModal(null)}></div>
                            <div className="bg-white rounded-[32px] w-full max-w-lg relative overflow-hidden shadow-2xl animate-fade-in">
                                <div className="p-6 bg-green-600 text-white flex justify-between items-center">
                                    <h3 className="font-black uppercase text-sm tracking-wider">Input Setoran Kas</h3>
                                    <button onClick={() => setShowModal(null)} className="hover:rotate-90 transition-transform"><Icon name="x" /></button>
                                </div>
                                <div className="p-8 space-y-5">
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Pilih Anggota</label>
                                        <select className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none focus:border-green-500" onChange={(e)=>setSavingForm({...savingForm, memberId: e.target.value})}>
                                            <option value="">-- Pilih Anggota --</option>
                                            {members.map(m => <option key={m.id} value={m.id}>{m.name} ({m.id})</option>)}
                                        </select>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Simpanan Pokok (Rp)</label>
                                            <input type="number" className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none" value={savingForm.pokok || ''} onChange={(e)=>setSavingForm({...savingForm, pokok: Number(e.target.value)})}/>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Simpanan Wajib (Rp)</label>
                                            <input type="number" className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none" value={savingForm.wajib || ''} onChange={(e)=>setSavingForm({...savingForm, wajib: Number(e.target.value)})}/>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Simpanan Sukarela (Rp)</label>
                                            <input type="number" className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none" value={savingForm.sukarela || ''} onChange={(e)=>setSavingForm({...savingForm, sukarela: Number(e.target.value)})}/>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Setoran Cicilan (Rp)</label>
                                            <input type="number" className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none" value={savingForm.cicilan || ''} onChange={(e)=>setSavingForm({...savingForm, cicilan: Number(e.target.value)})}/>
                                        </div>
                                    </div>
                                    
                                    <div className="p-6 bg-green-50 rounded-2xl border border-green-100 flex justify-between items-center mt-6">
                                        <p className="text-[10px] font-black uppercase text-green-800">Total Masuk</p>
                                        <p className="text-2xl font-black text-green-600">{formatIDR(Number(savingForm.pokok) + Number(savingForm.wajib) + Number(savingForm.sukarela) + Number(savingForm.cicilan))}</p>
                                    </div>
                                    <button onClick={handleAddSaving} disabled={!savingForm.memberId} className="w-full bg-green-600 hover:bg-green-700 disabled:bg-slate-300 text-white py-4 rounded-xl font-black shadow-lg transition-colors mt-4">SIMPAN TRANSAKSI</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL PENGELUARAN (ADMIN) */}
                    {showModal === 'expense' && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 print-hide">
                            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={() => setShowModal(null)}></div>
                            <div className="bg-white rounded-[32px] w-full max-w-lg relative overflow-hidden shadow-2xl animate-fade-in flex flex-col max-h-[90vh]">
                                <div className="p-6 bg-red-500 text-white flex justify-between items-center shrink-0">
                                    <h3 className="font-black uppercase text-sm tracking-wider">Catat Pengeluaran Beban</h3>
                                    <button onClick={() => setShowModal(null)} className="hover:rotate-90 transition-transform"><Icon name="x" /></button>
                                </div>
                                <div className="p-8 space-y-5 overflow-y-auto custom-scrollbar">
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Pilih Kategori Beban</label>
                                        <select className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none focus:border-red-500" value={expenseForm.category} onChange={(e)=>setExpenseForm({...expenseForm, category: e.target.value})}>
                                            <option value="">-- Pilih Kategori --</option>
                                            {EXPENSE_CATEGORIES.map(group => (
                                                <optgroup key={group.group} label={group.group} className="font-black text-gray-400">
                                                    {group.items.map(item => <option key={item} value={item} className="font-medium text-slate-700">{item}</option>)}
                                                </optgroup>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Nominal Pengeluaran (Rp)</label>
                                        <input type="number" className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none focus:border-red-500" value={expenseForm.amount} onChange={(e)=>setExpenseForm({...expenseForm, amount: Number(e.target.value)})}/>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Catatan Tambahan (Opsional)</label>
                                        <input type="text" placeholder="Misal: Tagihan PLN Bulan Juli" className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none focus:border-red-500" value={expenseForm.notes} onChange={(e)=>setExpenseForm({...expenseForm, notes: e.target.value})}/>
                                    </div>
                                    <button onClick={handleAddExpense} disabled={!expenseForm.category || !expenseForm.amount} className="w-full bg-red-500 hover:bg-red-600 disabled:bg-slate-300 text-white py-4 rounded-xl font-black shadow-lg transition-colors mt-4">SIMPAN PENGELUARAN</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL KREDIT (ADMIN) */}
                    {showModal === 'kredit' && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 print-hide">
                            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={() => setShowModal(null)}></div>
                            <div className="bg-white rounded-[32px] w-full max-w-lg relative overflow-hidden shadow-2xl animate-fade-in flex flex-col max-h-[90vh]">
                                <div className="p-6 bg-orange-600 text-white flex justify-between items-center shrink-0">
                                    <h3 className="font-black uppercase text-sm tracking-wider">Akad Kredit Baru</h3>
                                    <button onClick={() => setShowModal(null)} className="hover:rotate-90 transition-transform"><Icon name="x" /></button>
                                </div>
                                <div className="p-8 space-y-5 overflow-y-auto custom-scrollbar">
                                    {kreditForm.requestId && (
                                        <div className="p-3 mb-2 bg-blue-50 text-blue-700 text-xs font-bold rounded-xl border border-blue-100 flex items-center gap-2">
                                            <Icon name="bell" size={16}/> Formulir Pra-isi dari Pengajuan Anggota
                                        </div>
                                    )}
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Pilih Anggota</label>
                                        <select className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none focus:border-orange-500" value={kreditForm.memberId} onChange={(e)=>setKreditForm({...kreditForm, memberId: e.target.value})}>
                                            <option value="">-- Pilih Anggota --</option>
                                            {members.map(m => <option key={m.id} value={m.id}>{m.name} ({m.id})</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Keterangan / Tujuan</label>
                                        <input type="text" placeholder="Misal: Modal Usaha" className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none focus:border-orange-500" value={kreditForm.title} onChange={(e)=>setKreditForm({...kreditForm, title: e.target.value})}/>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Plafon Pinjaman (Rp)</label>
                                            <input type="number" className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none focus:border-orange-500" value={kreditForm.amount} onChange={(e)=>setKreditForm({...kreditForm, amount: Number(e.target.value)})}/>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Margin Keuntungan (%)</label>
                                            <input type="number" step="0.1" className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none focus:border-orange-500" value={kreditForm.marginPercent} onChange={(e)=>setKreditForm({...kreditForm, marginPercent: Number(e.target.value)})}/>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Tenor Pembiayaan</label>
                                        <div className="flex gap-2">
                                            {[1, 2, 3].map(t => (
                                                <button key={t} onClick={() => setKreditForm({...kreditForm, tenor: t})} className={`flex-1 py-3 rounded-xl border font-black transition-colors ${kreditForm.tenor === t ? 'border-orange-500 bg-orange-50 text-orange-600' : 'border-slate-200 text-slate-400 hover:bg-slate-50'}`}>{t} Tahun</button>
                                            ))}
                                        </div>
                                    </div>
                                    
                                    <div className="p-6 bg-slate-900 rounded-2xl flex justify-between items-end mt-6 shadow-lg">
                                        <div>
                                            <p className="text-[10px] font-black uppercase text-slate-400 mb-1">Estimasi Cicilan / Bln</p>
                                            <p className="text-2xl font-black text-white">{formatIDR(calculateKredit().monthly)}</p>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-[8px] font-black uppercase text-orange-400 mb-1">Total Pengembalian</p>
                                            <p className="text-sm font-bold text-slate-300">{formatIDR(calculateKredit().total)}</p>
                                        </div>
                                    </div>
                                    <button onClick={handleAddKredit} disabled={!kreditForm.memberId || !kreditForm.amount || !kreditForm.title} className="w-full bg-orange-600 hover:bg-orange-700 disabled:bg-slate-300 text-white py-4 rounded-xl font-black shadow-lg transition-colors mt-4">KIRIM PENGAJUAN</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL CETAK ID CARD */}
                    {printMember && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm print-bg-white print-hide">
                            <div className="bg-white rounded-[32px] w-full max-w-lg overflow-hidden shadow-2xl animate-fade-in flex flex-col print-no-shadow">
                                <div className="p-6 bg-blue-600 text-white flex justify-between items-center print-hide">
                                    <h3 className="font-black uppercase text-sm tracking-wider flex items-center gap-2"><Icon name="print"/> Cetak ID Card</h3>
                                    <button onClick={() => setPrintMember(null)} className="hover:rotate-90 transition-transform"><Icon name="x" /></button>
                                </div>
                                
                                <div className="p-8 flex flex-col items-center justify-center bg-slate-100 print-p-0 print-bg-white">
                                    <p className="text-xs text-slate-500 mb-6 text-center print-hide">
                                        Kartu ini berukuran standar CR80 (86mm x 54mm). Anda bisa mencetaknya di kertas PVC ID Card menggunakan Printer ID khusus, atau mencetaknya secara masal di kertas A4.
                                    </p>

                                    {/* --- KANVAS KARTU ANGGOTA --- */}
                                    <div className="id-card flex items-center justify-center w-full relative">
                                        <div 
                                            className="bg-gradient-to-br from-blue-800 to-slate-900 rounded-xl shadow-xl overflow-hidden relative text-white flex box-border shrink-0" 
                                            style={{ width: '86mm', height: '54mm', padding: '4mm' }}
                                        >
                                            <div className="absolute -right-8 -top-8 opacity-[0.08]"><Icon name="shu" size={130}/></div>
                                            <div className="absolute left-0 bottom-0 w-full h-1/3 bg-gradient-to-t from-blue-600/30 to-transparent"></div>

                                            <div className="w-[30%] flex flex-col items-center justify-between border-r border-white/20 pr-[4mm] relative z-10 h-full">
                                                <div className="w-full aspect-[3/4] bg-white/10 rounded overflow-hidden border border-white/30 flex items-center justify-center">
                                                    {printMember.photo_url ? (
                                                        <img src={printMember.photo_url} className="w-full h-full object-cover"/>
                                                    ) : (
                                                        <Icon name="user" size={24} className="text-white/50"/>
                                                    )}
                                                </div>
                                                <div className="bg-white p-[2mm] rounded mt-[2mm] shrink-0 w-full aspect-square flex items-center justify-center">
                                                    <img src={`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${printMember.id}`} className="w-full h-full object-contain mix-blend-multiply" alt="QR Code"/>
                                                </div>
                                            </div>

                                            <div className="w-[70%] pl-[4mm] flex flex-col relative z-10 h-full">
                                                <div className="flex items-center gap-2 mb-1">
                                                    <div className="w-5 h-5 bg-blue-500 rounded flex items-center justify-center font-black text-[10px] shadow-md shadow-blue-500/50">K</div>
                                                    <h2 className="text-[10px] font-black uppercase tracking-widest text-blue-200">SikopPro Digital</h2>
                                                </div>
                                                <div className="w-full h-[1px] bg-white/20 mb-3 mt-1"></div>

                                                <h3 className="text-[13px] font-black leading-tight uppercase truncate">{printMember.name}</h3>
                                                <p className="text-[10px] font-mono text-blue-300 mb-auto">{printMember.id}</p>

                                                <div className="space-y-[2mm] mt-2 w-full">
                                                    <div>
                                                        <p className="text-[6px] text-blue-300/80 uppercase tracking-widest leading-none mb-0.5">NIK (Kependudukan)</p>
                                                        <p className="text-[9px] font-bold font-mono tracking-wider leading-none">{printMember.nik}</p>
                                                    </div>
                                                    <div className="flex justify-between items-end">
                                                        <div>
                                                            <p className="text-[6px] text-blue-300/80 uppercase tracking-widest leading-none mb-0.5">Tgl. Bergabung</p>
                                                            <p className="text-[8px] font-bold leading-none">{printMember.join_date}</p>
                                                        </div>
                                                        <div className="text-right">
                                                            <p className="text-[6px] text-blue-300/80 uppercase tracking-widest leading-none mb-0.5">Status Anggota</p>
                                                            <p className="text-[8px] font-black text-green-400 uppercase leading-none">{printMember.status}</p>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <button onClick={() => window.print()} className="mt-8 bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-xl font-black shadow-lg flex items-center gap-3 transition-colors print-hide">
                                        <Icon name="print" size={24}/> CETAK KARTU SEKARANG
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CUSTOM ALERT MODAL */}
                    {alertMessage && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in print-hide">
                            <div className="bg-white p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl border border-slate-100">
                                <div className="w-16 h-16 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="bell" size={30}/></div>
                                <p className="font-black text-slate-800 mb-6 text-sm">{alertMessage}</p>
                                <button onClick={() => setAlertMessage(null)} className="bg-blue-600 hover:bg-blue-700 transition-colors text-white px-6 py-3 rounded-xl font-black w-full shadow-lg shadow-blue-200">Oke, Mengerti</button>
                            </div>
                        </div>
                    )}

                    {/* CUSTOM CONFIRM MODAL */}
                    {confirmAction && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in print-hide">
                            <div className="bg-white p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl border border-slate-100">
                                <div className="w-16 h-16 bg-orange-50 text-orange-500 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="bell" size={30}/></div>
                                <p className="font-black text-slate-800 mb-6 text-sm">{confirmAction.message}</p>
                                <div className="flex gap-4">
                                    <button onClick={() => setConfirmAction(null)} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-3 rounded-xl font-black transition-colors">Batal</button>
                                    <button onClick={() => { confirmAction.onConfirm(); setConfirmAction(null); }} className="flex-1 bg-orange-600 hover:bg-orange-700 text-white px-4 py-3 rounded-xl font-black transition-colors shadow-lg shadow-orange-200">Ya, Lanjutkan</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
