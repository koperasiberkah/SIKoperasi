<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koperasi Santri - Pendaftaran Online & Portal</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->

    <!-- SheetJS (Excel) -->

    <!-- html2canvas (Export to PNG) -->

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.5); }

        /* Konfigurasi Khusus untuk Cetak (Print) ID Card */
        @media print {
            body { margin: 0; padding: 0; background: white; }
            .print-hide { display: none !important; }
            .print-bg-white { background: white !important; backdrop-filter: none !important; position: absolute; left:0; top:0; width: 100%; height: 100%; align-items: flex-start !important; justify-content: flex-start !important; }
            .print-no-shadow { box-shadow: none !important; border-radius: 0 !important; max-width: none !important; }
            .print-p-0 { padding: 0 !important; }
            .id-card { margin: 0 !important; border-radius: 0 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            @page { size: 86mm 54mm landscape; margin: 0; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, Fragment } = React;

        // ==========================================
        // 1. KONFIGURASI SUPABASE
        // ==========================================
        const SUPABASE_URL = 'https://pbxdhyktzgmttincxfdx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_hXOz-MRO5VdWVqIxXEXqeA_m0jmdSd7';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Kategori Pengeluaran (Beban)
        const EXPENSE_CATEGORIES = [
            {
                group: 'Beban Operasional & Administrasi',
                items: ['Beban Gaji dan Honorarium Pengelola', 'Beban Insentif dan Bonus Karyawan', 'Beban Alat Tulis Kantor (ATK)', 'Beban Perlengkapan Kantor', 'Beban Listrik, Air, dan Internet', 'Beban Telepon dan Komunikasi', 'Beban Pemeliharaan Gedung', 'Beban Pemeliharaan Inventaris Kantor', 'Beban Transportasi dan Perjalanan Dinas', 'Beban Promosi dan Pemasaran', 'Beban Penyusutan Inventaris & Aset Tetap', 'Beban Amortisasi']
            },
            {
                group: 'Beban Organisasi',
                items: ['Beban Penyelenggaraan RAT (Rapat Anggota Tahunan)', 'Beban Rapat Pengurus dan Pengawas', 'Beban Pendidikan dan Pelatihan Anggota', 'Beban Pendidikan dan Pelatihan Pengurus', 'Beban Kehormatan Pengurus dan Pengawas', 'Beban Hubungan Masyarakat (Humas)']
            },
            {
                group: 'Beban Keuangan & Perkoperasian',
                items: ['Beban Bunga Pinjaman Bank', 'Beban Bunga Simpanan Berjangka Anggota', 'Beban Bunga Simpanan Sukarela Anggota', 'Beban Administrasi Bank', 'Beban Pajak Penghasilan (PPh) Koperasi', 'Beban Penyisihan Penghapusan Piutang Macet']
            },
            {
                group: 'Beban Sosial',
                items: ['Beban Dana Sosial Anggota', 'Beban Santunan dan Donasi Lingkungan']
            }
        ];

        // ==========================================
        // 2. KOMPONEN IKON
        // ==========================================
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                dashboard: <Fragment><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></Fragment>,
                users: <Fragment><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Fragment>,
                wallet: <Fragment><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"/></Fragment>,
                kredit: <Fragment><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></Fragment>,
                file: <Fragment><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></Fragment>,
                shu: <Fragment><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></Fragment>,
                plus: <Fragment><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Fragment>,
                x: <Fragment><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Fragment>,
                camera: <Fragment><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></Fragment>,
                menu: <Fragment><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></Fragment>,
                logout: <Fragment><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></Fragment>,
                user: <Fragment><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Fragment>,
                print: <Fragment><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></Fragment>,
                bell: <Fragment><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></Fragment>,
                send: <Fragment><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></Fragment>,
                check: <Fragment><polyline points="20 6 9 17 4 12"></polyline></Fragment>,
                receipt: <Fragment><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1Z"></path><path d="M16 8h-6"></path><path d="M16 12h-8"></path><path d="M16 16h-8"></path></Fragment>,
                download: <Fragment><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></Fragment>,
                settings: <Fragment><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></Fragment>,
                trash: <Fragment><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></Fragment>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        // ==========================================
        // 3. APLIKASI UTAMA
        // ==========================================
        function App() {
            // State Sesi & Autentikasi
            const [session, setSession] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [myProfile, setMyProfile] = useState(null);
            
            // State Pengaturan Dinamis
            const [coopName, setCoopName] = useState('Koperasi Santri');
            const [coopLogo, setCoopLogo] = useState('https://raw.githubusercontent.com/koperasiberkah/SIKoperasi/refs/heads/main/LOGO%20SKB.png');
            const [adminList, setAdminList] = useState([]);
            const [newAdmin, setNewAdmin] = useState({ email: '', role: 'Admin Standar' });

            // State UI Login / Register
            const [isRegistering, setIsRegistering] = useState(false);
            const [loginForm, setLoginForm] = useState({ email: '', password: '' });
            const [registerForm, setRegisterForm] = useState({
                name: '', nik: '', gender: '', birthDate: '', address: '', phone: '', email: '', password: '', photoFile: null, photoPreview: null
            });
            const [authError, setAuthError] = useState('');
            const [authLoading, setAuthLoading] = useState(false);

            // State Data Aplikasi
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [showModal, setShowModal] = useState(null);
            const [printMember, setPrintMember] = useState(null);
            const [members, setMembers] = useState([]);
            const [savings, setSavings] = useState([]);
            const [financings, setFinancings] = useState([]);
            const [requests, setRequests] = useState([]);
            const [expenses, setExpenses] = useState([]);

            // State Form
            const [savingForm, setSavingForm] = useState({ memberId: '', pokok: 0, wajib: 0, sukarela: 0, cicilan: 0 });
            const [kreditForm, setKreditForm] = useState({ memberId: '', title: '', amount: 0, marginPercent: 5, tenor: 1, requestId: null });
            const [requestForm, setRequestForm] = useState({ type: 'Kredit', amount: '', tenor: 1, notes: '' });
            const [expenseForm, setExpenseForm] = useState({ category: '', amount: '', notes: '' });

            // Custom Alert & Confirm State
            const [alertMessage, setAlertMessage] = useState(null);
            const [confirmAction, setConfirmAction] = useState(null);

            // Format Uang
            const formatIDR = (val) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val || 0);

            // ==========================================
            // 4. EFEK & PENGAMBILAN DATA (HTTP POLLING REAL-TIME)
            // ==========================================
            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    handleSession(session);
                });

                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    handleSession(session);
                });

                return () => subscription.unsubscribe();
            }, []);

            useEffect(() => {
                if (!session) return;
                
                const email = session.user.email;
                const checkIsAdmin = email.includes('admin@') || adminList.some(a => a.email === email);

                const refreshData = () => {
                    if (checkIsAdmin) fetchAdminData();
                    else fetchMemberData(email);
                };

                const intervalId = setInterval(() => {
                    refreshData();
                }, 5000);

                return () => {
                    clearInterval(intervalId);
                };
            }, [session, adminList]);

            const handleSession = async (sessionData) => {
                setSession(sessionData);
                if (sessionData) {
                    const email = sessionData.user.email;
                    
                    // 1. Load Data Profil & Pengaturan Terlebih Dahulu
                    try {
                        const { data: settingsData } = await supabase.from('settings').select('*').eq('id', 1).single();
                        if (settingsData) {
                            setCoopName(settingsData.name || 'Koperasi Santri');
                            setCoopLogo(settingsData.logo_url || 'https://raw.githubusercontent.com/koperasiberkah/SIKoperasi/refs/heads/main/LOGO%20SKB.png');
                        }
                    } catch(e) { console.log('Tabel settings belum ada'); }

                    // 2. Cek Otoritas Admin
                    let checkIsAdmin = email.includes('admin@');
                    try {
                        const { data: adminData } = await supabase.from('admins').select('*');
                        if (adminData) {
                            setAdminList(adminData);
                            if (adminData.some(a => a.email === email)) checkIsAdmin = true;
                        }
                    } catch(e) { console.log('Tabel admins belum ada'); }
                    
                    setIsAdmin(checkIsAdmin);
                    
                    if (checkIsAdmin) {
                        setActiveTab('dashboard');
                        fetchAdminData();
                    } else {
                        setActiveTab('member_dashboard');
                        fetchMemberData(email);
                    }
                }
            };

            const fetchAdminData = async () => {
                const [memRes, savRes, finRes, reqRes, expRes] = await Promise.all([
                    supabase.from('members').select('*'),
                    supabase.from('savings').select('*'),
                    supabase.from('financings').select('*'),
                    supabase.from('requests').select('*').order('date', { ascending: false }),
                    supabase.from('expenses').select('*').order('date', { ascending: false })
                ]);
                if (memRes.data) setMembers(memRes.data);
                if (savRes.data) setSavings(savRes.data);
                if (finRes.data) setFinancings(finRes.data);
                if (reqRes.data) setRequests(reqRes.data);
                if (expRes.data) setExpenses(expRes.data);

                // Sinkronisasi Admin Secara Berkala (Diperbaiki)
                try {
                    const { data: admData, error } = await supabase.from('admins').select('*');
                    if (admData && !error) {
                        setAdminList(admData);
                    }
                } catch (err) {
                    console.log('Gagal memuat data admin atau tabel belum ada:', err);
                }
            };

            const fetchMemberData = async (email) => {
                const { data: profile } = await supabase.from('members').select('*').eq('email', email).single();
                if (profile) {
                    setMyProfile(profile);
                    const [savRes, finRes, reqRes] = await Promise.all([
                        supabase.from('savings').select('*').eq('member_id', profile.id),
                        supabase.from('financings').select('*').eq('member_id', profile.id),
                        supabase.from('requests').select('*').eq('member_id', profile.id).order('date', { ascending: false })
                    ]);
                    if (savRes.data) setSavings(savRes.data);
                    if (finRes.data) setFinancings(finRes.data);
                    if (reqRes.data) setRequests(reqRes.data);
                } else {
                    setAuthError("Profil tidak ditemukan. Pastikan email terdaftar di database Koperasi.");
                }
            };

            // ==========================================
            // 5. FUNGSI AUTENTIKASI
            // ==========================================
            const handleLogin = async (e) => {
                e.preventDefault();
                setAuthLoading(true);
                setAuthError('');

                if (SUPABASE_URL.includes('YOUR_PROJECT_ID')) {
                    setAuthError("Koneksi Gagal: Anda belum mengganti SUPABASE_URL.");
                    setAuthLoading(false);
                    return;
                }

                try {
                    const { error } = await supabase.auth.signInWithPassword(loginForm);
                    if (error) {
                        setAuthError(error.message || "Email atau Password salah!");
                    }
                } catch (err) {
                    console.error("Fetch error:", err);
                    setAuthError("Koneksi ke server gagal (Failed to fetch). Pastikan internet stabil atau cek apakah Project Supabase Anda sedang 'Paused'.");
                } finally {
                    setAuthLoading(false);
                }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                setAuthLoading(true);
                setAuthError('');
                
                try {
                    if (!registerForm.email || !registerForm.password || !registerForm.name || !registerForm.nik || !registerForm.birthDate) {
                        throw new Error("Semua kolom bertanda * wajib diisi!");
                    }

                    const { data: authData, error: authError } = await supabase.auth.signUp({
                        email: registerForm.email,
                        password: registerForm.password,
                    });
                    if (authError) throw authError;

                    let photoUrl = null;
                    if (registerForm.photoFile) {
                        const fileExt = registerForm.photoFile.name.split('.').pop();
                        const fileName = `public_${Math.random()}.${fileExt}`;
                        const { error: uploadErr } = await supabase.storage.from('member-photos').upload(fileName, registerForm.photoFile);
                        if (!uploadErr) {
                            const { data: pubUrl } = supabase.storage.from('member-photos').getPublicUrl(fileName);
                            photoUrl = pubUrl.publicUrl;
                        }
                    }

                    const newId = `ANG-${Math.random().toString(36).substring(2, 6).toUpperCase()}`;
                    const { error: dbError } = await supabase.from('members').insert([{
                        id: newId,
                        name: registerForm.name,
                        nik: registerForm.nik,
                        gender: registerForm.gender,
                        birth_date: registerForm.birthDate,
                        address: registerForm.address,
                        phone: registerForm.phone,
                        email: registerForm.email,
                        status: 'Aktif',
                        join_date: new Date().toISOString().split('T')[0],
                        photo_url: photoUrl
                    }]);
                    
                    if (dbError) throw dbError;

                    setAlertMessage("Pendaftaran Berhasil! Silakan Login.");
                    setIsRegistering(false);
                } catch (err) {
                    setAuthError(err.message);
                } finally {
                    setAuthLoading(false);
                }
            };

            const handleLogout = async () => {
                try {
                    await supabase.auth.signOut();
                } catch (err) {
                    console.error("Logout error:", err);
                } finally {
                    setSession(null);
                    setMyProfile(null);
                    setIsAdmin(false);
                    setMembers([]); setSavings([]); setFinancings([]); setRequests([]); setExpenses([]);
                }
            };

            // ==========================================
            // 6. PERHITUNGAN OTOMATIS (KEUANGAN LENGKAP)
            // ==========================================
            const memberFinancialData = useMemo(() => {
                const targetMembers = isAdmin ? members : (myProfile ? [myProfile] : []);
                return targetMembers.map(member => {
                    const mSavings = savings.filter(s => s.member_id === member.id);
                    const p = mSavings.filter(s => s.type === 'Pokok').reduce((a, b) => a + Number(b.amount), 0);
                    const w = mSavings.filter(s => s.type === 'Wajib').reduce((a, b) => a + Number(b.amount), 0);
                    const s = mSavings.filter(s => s.type === 'Sukarela').reduce((a, b) => a + Number(b.amount), 0);
                    const c = mSavings.filter(s => s.type === 'Cicilan').reduce((a, b) => a + Number(b.amount), 0);
                    
                    const mCredits = financings.filter(f => f.member_id === member.id);
                    const angsuran = mCredits.reduce((a, b) => a + Number(b.monthly), 0);
                    
                    const marginContrib = mCredits.reduce((acc, curr) => acc + (Number(curr.amount) * (Number(curr.margin_percent) / 100) * Number(curr.tenor)), 0);
                    const totalPlafon = mCredits.reduce((acc, curr) => acc + Number(curr.amount), 0);
                    const totalPayable = totalPlafon + marginContrib;

                    const marginRatio = totalPayable > 0 ? (marginContrib / totalPayable) : 0;
                    const actualMarginPaid = c * marginRatio;

                    return { ...member, pokok: p, wajib: w, sukarela: s, cicilanDibayar: c, totalSavings: p+w+s, totalAngsuran: angsuran, marginContrib, actualMarginPaid };
                });
            }, [members, savings, financings, isAdmin, myProfile]);

            // Laba Rugi Calculations (Cash Basis)
            const totalPendapatan = useMemo(() => memberFinancialData.reduce((acc, curr) => acc + curr.actualMarginPaid, 0), [memberFinancialData]);
            const totalBeban = useMemo(() => expenses.reduce((a, b) => a + Number(b.amount), 0), [expenses]);
            const labaBersih = totalPendapatan - totalBeban;

            // Arus Kas Calculations
            const totalKasSimpanan = useMemo(() => savings.filter(s => ['Pokok', 'Wajib', 'Sukarela'].includes(s.type) && s.amount > 0).reduce((a, b) => a + Number(b.amount), 0), [savings]);
            const totalKasCicilan = useMemo(() => savings.filter(s => s.type === 'Cicilan').reduce((a, b) => a + Number(b.amount), 0), [savings]);
            const totalKasMasuk = totalKasSimpanan + totalKasCicilan;
            
            const totalKasKeluarPenarikan = useMemo(() => Math.abs(savings.filter(s => s.amount < 0).reduce((a, b) => a + Number(b.amount), 0)), [savings]);
            const totalKasKeluarKredit = useMemo(() => financings.reduce((a, b) => a + Number(b.amount), 0), [financings]);
            
            const saldoKasAkhir = totalKasMasuk - totalKasKeluarPenarikan - totalKasKeluarKredit - totalBeban;

            // Neraca Calculations (Aktiva = Pasiva)
            const totalPokok = useMemo(() => savings.filter(s => s.type === 'Pokok').reduce((a, b) => a + Number(b.amount), 0), [savings]);
            const totalWajib = useMemo(() => savings.filter(s => s.type === 'Wajib').reduce((a, b) => a + Number(b.amount), 0), [savings]);
            const totalSukarelaMasuk = useMemo(() => savings.filter(s => s.type === 'Sukarela' && s.amount > 0).reduce((a, b) => a + Number(b.amount), 0), [savings]);
            const simpananSukarelaBersih = totalSukarelaMasuk - totalKasKeluarPenarikan;

            const pengembalianPokok = totalKasCicilan - totalPendapatan;
            const piutangKredit = totalKasKeluarKredit - pengembalianPokok;

            const totalAktiva = saldoKasAkhir + piutangKredit;
            const totalPasiva = simpananSukarelaBersih + totalPokok + totalWajib + labaBersih;

            const totalCoopSavings = useMemo(() => memberFinancialData.reduce((acc, curr) => acc + curr.totalSavings, 0), [memberFinancialData]);
            const myData = memberFinancialData[0] || {};
            const pendingRequestsCount = requests.filter(r => r.status === 'Menunggu').length;

            // ==========================================
            // FITUR EXCEL DOWNLOAD (MULTI-SHEET)
            // ==========================================
            const handleDownloadExcel = () => {
                if (typeof XLSX === 'undefined') {
                    setAlertMessage("Library Excel sedang dimuat, silakan coba beberapa detik lagi.");
                    return;
                }

                // Membuat Workbook (File Excel Baru)
                const wb = XLSX.utils.book_new();

                // 1. SHEET: LABA RUGI
                const dataLabaRugi = [
                    [`LAPORAN LABA RUGI (CASH BASIS) - ${coopName.toUpperCase()}`],
                    [],
                    ["Deskripsi", "Nominal (Rp)"],
                    ["Pendapatan Margin (Telah Dibayar)", totalPendapatan],
                    ["Beban Operasional & Lainnya", -totalBeban],
                    ["Laba Bersih (SHU Riil)", labaBersih]
                ];
                const wsLabaRugi = XLSX.utils.aoa_to_sheet(dataLabaRugi);
                XLSX.utils.book_append_sheet(wb, wsLabaRugi, "Laba Rugi");

                // 2. SHEET: ARUS KAS
                const dataArusKas = [
                    [`LAPORAN ARUS KAS (CASH FLOW) - ${coopName.toUpperCase()}`],
                    [],
                    ["Deskripsi", "Nominal (Rp)"],
                    ["Kas Masuk (Setoran Simpanan)", totalKasSimpanan],
                    ["Kas Masuk (Setoran Cicilan)", totalKasCicilan],
                    ["Kas Keluar (Penarikan Anggota)", -totalKasKeluarPenarikan],
                    ["Kas Keluar (Pencairan Kredit)", -totalKasKeluarKredit],
                    ["Kas Keluar (Beban Pengeluaran)", -totalBeban],
                    ["Saldo Kas Tunai Akhir", saldoKasAkhir]
                ];
                const wsArusKas = XLSX.utils.aoa_to_sheet(dataArusKas);
                XLSX.utils.book_append_sheet(wb, wsArusKas, "Arus Kas");

                // 3. SHEET: NERACA
                const dataNeraca = [
                    [`NERACA KEUANGAN KOPERASI - ${coopName.toUpperCase()}`],
                    [],
                    ["AKTIVA", "Nominal (Rp)"],
                    ["Kas Tunai & Bank", saldoKasAkhir],
                    ["Piutang Pembiayaan Anggota", piutangKredit],
                    ["TOTAL AKTIVA", totalAktiva],
                    [],
                    ["PASIVA", "Nominal (Rp)"],
                    ["Kewajiban (Simpanan Sukarela Netto)", simpananSukarelaBersih],
                    ["Ekuitas (Simpanan Pokok)", totalPokok],
                    ["Ekuitas (Simpanan Wajib)", totalWajib],
                    ["Ekuitas (SHU Berjalan)", labaBersih],
                    ["TOTAL PASIVA", totalPasiva]
                ];
                const wsNeraca = XLSX.utils.aoa_to_sheet(dataNeraca);
                XLSX.utils.book_append_sheet(wb, wsNeraca, "Neraca");

                // 4. SHEET: DATA ANGGOTA
                const dataAnggota = [
                    ["RINCIAN FINANSIAL PER ANGGOTA"],
                    [],
                    ["Nama Anggota", "ID Anggota", "Simpanan Pokok", "Simpanan Wajib", "Simpanan Sukarela", "Total Simpanan", "Tagihan Cicilan"],
                    ...memberFinancialData.map(m => [
                        m.name, 
                        m.id, 
                        m.pokok, 
                        m.wajib, 
                        m.sukarela, 
                        m.totalSavings, 
                        m.totalAngsuran
                    ])
                ];
                const wsAnggota = XLSX.utils.aoa_to_sheet(dataAnggota);
                XLSX.utils.book_append_sheet(wb, wsAnggota, "Data Anggota");

                // Mengekspor File .xlsx
                XLSX.writeFile(wb, `Laporan_Keuangan_${coopName.replace(/\s+/g, '_')}_${new Date().toISOString().split('T')[0]}.xlsx`);
            };

            // ==========================================
            // FITUR DOWNLOAD ID CARD (PNG HIGH-RES)
            // ==========================================
            const handleDownloadIDCard = async () => {
                const cardElement = document.getElementById('id-card-element');
                if (!cardElement) return;

                setAlertMessage("Sedang merender ID Card beresolusi tinggi...");

                try {
                    const canvas = await window.html2canvas(cardElement, {
                        scale: 4, // Skala 4x untuk kualitas cetak yang tajam (High Definition)
                        useCORS: true, // Mengizinkan pemuatan gambar dari link luar (Supabase & QR Code)
                        backgroundColor: null
                    });

                    const imgData = canvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    link.download = `ID_Card_${printMember.name.replace(/\s+/g, '_')}.png`;
                    link.href = imgData;
                    link.click();
                    
                    setAlertMessage(null); // Menutup notifikasi setelah selesai
                } catch (error) {
                    console.error("Error rendering canvas:", error);
                    setAlertMessage("Gagal menyimpan gambar. Pastikan koneksi stabil.");
                }
            };

            // ==========================================
            // LOGIKA RENDER NAMA KOPERASI (SPLIT WARNA)
            // ==========================================
            const renderCoopName = () => {
                const words = coopName.split(' ');
                if (words.length > 1) {
                    return <span className="font-black text-lg text-slate-800 tracking-tighter uppercase leading-tight">{words[0]}<br/><span className="text-amber-500">{words.slice(1).join(' ')}</span></span>;
                }
                return <span className="font-black text-lg text-slate-800 tracking-tighter uppercase leading-tight">{coopName}</span>;
            }

            // ==========================================
            // FUNGSI UPDATE PENGATURAN (ADMIN)
            // ==========================================
            const handleUpdateSettings = async () => {
                const { error } = await supabase.from('settings').upsert({ id: 1, name: coopName, logo_url: coopLogo });
                if (!error) {
                    setAlertMessage("Profil koperasi berhasil diperbarui!");
                } else {
                    setAlertMessage(`Gagal menyimpan: Pastikan Anda sudah membuat tabel 'settings' di database. Detail Error: ${error.message}`);
                }
            };

            const handleAddAdmin = async () => {
                if (!newAdmin.email) return;
                const { error } = await supabase.from('admins').insert([{ email: newAdmin.email, role: newAdmin.role }]);
                if (!error) {
                    setAlertMessage(`Email ${newAdmin.email} berhasil diberikan hak akses ${newAdmin.role}!`);
                    setNewAdmin({ email: '', role: 'Admin Standar' });
                    // Refresh data
                    const { data } = await supabase.from('admins').select('*');
                    if (data) setAdminList(data);
                } else {
                    setAlertMessage(`Gagal menambah admin: ${error.message}`);
                }
            };

            const handleDeleteAdmin = async (id) => {
                setConfirmAction({
                    message: "Yakin ingin mencabut hak akses Admin ini?",
                    onConfirm: async () => {
                        const { error } = await supabase.from('admins').delete().eq('id', id);
                        if (!error) {
                            const { data } = await supabase.from('admins').select('*');
                            if (data) setAdminList(data);
                        }
                    }
                });
            };

            // ==========================================
            // 7. RENDER HALAMAN LOGIN / REGISTER
            // ==========================================
            if (!session) {
                return (
                    <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4 print-hide">
                        <div className={`w-full ${isRegistering ? 'max-w-4xl' : 'max-w-md'} bg-white rounded-[32px] shadow-2xl overflow-hidden animate-fade-in transition-all duration-500`}>
                            <div className="bg-emerald-800 p-8 text-center relative">
                                <div className="w-24 h-24 bg-white backdrop-blur-md rounded-2xl flex items-center justify-center mx-auto mb-4 border-2 border-amber-400 shadow-lg overflow-hidden">
                                    <img src={coopLogo} alt="Logo Koperasi" className="w-full h-full object-contain p-2" />
                                </div>
                                <h1 className="text-2xl font-black tracking-tight text-amber-400">{isRegistering ? 'Pendaftaran Anggota' : coopName}</h1>
                                <p className="text-emerald-100 text-sm mt-2">{isRegistering ? 'Isi data diri Anda dengan lengkap' : 'Silakan login untuk mengakses data Anda'}</p>
                            </div>
                            
                            <div className="p-8">
                                {authError && <div className="mb-6 p-4 bg-red-50 text-red-600 rounded-xl text-sm font-bold border border-red-100 text-center">{authError}</div>}
                                
                                {!isRegistering ? (
                                    <form onSubmit={handleLogin} className="space-y-6">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-400 uppercase mb-2">Email Akun</label>
                                            <input type="email" required className="w-full p-4 bg-slate-50 rounded-xl border focus:border-emerald-600 outline-none font-bold text-slate-700" placeholder="nama@email.com" value={loginForm.email} onChange={e => setLoginForm({...loginForm, email: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-400 uppercase mb-2">Password</label>
                                            <input type="password" required className="w-full p-4 bg-slate-50 rounded-xl border focus:border-emerald-600 outline-none font-bold text-slate-700" placeholder="••••••••" value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} />
                                        </div>
                                        <button type="submit" disabled={authLoading} className="w-full py-4 bg-emerald-800 hover:bg-emerald-900 text-amber-400 rounded-xl font-black text-lg transition-colors shadow-lg shadow-emerald-200">
                                            {authLoading ? 'Memproses...' : 'MASUK'}
                                        </button>
                                        <div className="text-center pt-4 border-t border-slate-100">
                                            <p className="text-sm text-slate-500 mb-2">Belum memiliki akun Koperasi?</p>
                                            <button type="button" onClick={() => {setIsRegistering(true); setAuthError('');}} className="text-emerald-700 font-black hover:text-emerald-800 hover:underline">Daftar Anggota Online di sini</button>
                                        </div>
                                    </form>
                                ) : (
                                    <form onSubmit={handleRegister} className="space-y-6">
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                            <div className="space-y-6">
                                                <div className="bg-slate-50 p-6 rounded-2xl border text-center">
                                                    <label className="block text-xs font-bold text-slate-400 uppercase mb-4">Foto Profil (Opsional)</label>
                                                    <div className="w-32 h-40 mx-auto bg-white border-2 border-dashed border-slate-300 rounded-xl flex flex-col items-center justify-center relative overflow-hidden group hover:border-amber-400 cursor-pointer transition-colors">
                                                        {registerForm.photoPreview ? <img src={registerForm.photoPreview} className="w-full h-full object-cover"/> : <Icon name="camera" className="text-slate-300 group-hover:text-amber-500"/>}
                                                        <input type="file" accept="image/*" className="absolute inset-0 opacity-0 cursor-pointer" onChange={(e)=>{
                                                            const file = e.target.files[0];
                                                            if(file) setRegisterForm({...registerForm, photoFile: file, photoPreview: URL.createObjectURL(file)});
                                                        }} />
                                                    </div>
                                                </div>
                                                <div className="bg-emerald-50 p-5 rounded-2xl border border-emerald-100">
                                                    <h4 className="text-xs font-black text-emerald-800 uppercase mb-4 border-b border-emerald-200 pb-2">Buat Akun Login</h4>
                                                    <input type="email" required placeholder="Email Aktif *" className="w-full p-3 mb-3 bg-white rounded-lg border outline-none text-sm focus:border-emerald-500" onChange={e => setRegisterForm({...registerForm, email: e.target.value})} />
                                                    <input type="password" required placeholder="Password Minimal 6 Huruf *" className="w-full p-3 bg-white rounded-lg border outline-none text-sm focus:border-emerald-500" onChange={e => setRegisterForm({...registerForm, password: e.target.value})} />
                                                </div>
                                            </div>
                                            
                                            <div className="md:col-span-2 space-y-4">
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="text-[10px] font-bold text-slate-500 uppercase ml-1">Nama Lengkap Sesuai KTP *</label>
                                                        <input required placeholder="Contoh: Budi Santoso" className="w-full p-3.5 bg-slate-50 rounded-xl border outline-none mt-1 font-semibold focus:border-emerald-500" onChange={e => setRegisterForm({...registerForm, name: e.target.value})} />
                                                    </div>
                                                    <div>
                                                        <label className="text-[10px] font-bold text-slate-500 uppercase ml-1">Nomor Induk Kependudukan (NIK) *</label>
                                                        <input required placeholder="16 Digit NIK" className="w-full p-3.5 bg-slate-50 rounded-xl border outline-none mt-1 font-mono focus:border-emerald-500" onChange={e => setRegisterForm({...registerForm, nik: e.target.value})} />
                                                    </div>
                                                </div>
                                                
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="text-[10px] font-bold text-slate-500 uppercase ml-1">Jenis Kelamin</label>
                                                        <select className="w-full p-3.5 bg-slate-50 rounded-xl border outline-none mt-1 font-semibold focus:border-emerald-500" onChange={e => setRegisterForm({...registerForm, gender: e.target.value})}>
                                                            <option value="">Pilih...</option><option value="Laki-laki">Laki-laki</option><option value="Perempuan">Perempuan</option>
                                                        </select>
                                                    </div>
                                                    <div>
                                                        <label className="text-[10px] font-bold text-slate-500 uppercase ml-1">Tanggal Lahir *</label>
                                                        <input type="date" required className="w-full p-3.5 bg-slate-50 rounded-xl border outline-none mt-1 focus:border-emerald-500" onChange={e => setRegisterForm({...registerForm, birthDate: e.target.value})} />
                                                    </div>
                                                </div>

                                                <div>
                                                    <label className="text-[10px] font-bold text-slate-500 uppercase ml-1">Nomor HP / WhatsApp Aktif</label>
                                                    <input placeholder="Contoh: 08123456789" className="w-full p-3.5 bg-slate-50 rounded-xl border outline-none mt-1 focus:border-emerald-500" onChange={e => setRegisterForm({...registerForm, phone: e.target.value})} />
                                                </div>

                                                <div>
                                                    <label className="text-[10px] font-bold text-slate-500 uppercase ml-1">Alamat Domisili Lengkap</label>
                                                    <textarea required placeholder="Jalan, RT/RW, Kelurahan..." className="w-full p-3.5 bg-slate-50 rounded-xl border outline-none mt-1 h-24 resize-none focus:border-emerald-500" onChange={e => setRegisterForm({...registerForm, address: e.target.value})}></textarea>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div className="flex flex-col md:flex-row gap-4 pt-6 border-t">
                                            <button type="button" onClick={() => {setIsRegistering(false); setAuthError('');}} className="w-full md:w-1/3 py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold transition-colors">
                                                Batal
                                            </button>
                                            <button type="submit" disabled={authLoading} className="w-full md:w-2/3 py-4 bg-emerald-800 hover:bg-emerald-900 text-amber-400 rounded-xl font-black text-lg transition-colors shadow-lg shadow-emerald-200">
                                                {authLoading ? 'Menyimpan Data...' : 'KIRIM PENDAFTARAN'}
                                            </button>
                                        </div>
                                    </form>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // 8. FUNGSI ADMIN & MEMBER
            // ==========================================
            const handleAddSaving = async () => {
                const date = new Date().toISOString().split('T')[0];
                const entries = [];
                if (savingForm.pokok > 0) entries.push({ member_id: savingForm.memberId, type: 'Pokok', amount: Number(savingForm.pokok), date });
                if (savingForm.wajib > 0) entries.push({ member_id: savingForm.memberId, type: 'Wajib', amount: Number(savingForm.wajib), date });
                if (savingForm.sukarela > 0) entries.push({ member_id: savingForm.memberId, type: 'Sukarela', amount: Number(savingForm.sukarela), date });
                if (savingForm.cicilan > 0) entries.push({ member_id: savingForm.memberId, type: 'Cicilan', amount: Number(savingForm.cicilan), date });
                
                if (entries.length > 0) {
                    const { error } = await supabase.from('savings').insert(entries);
                    if (!error) {
                        fetchAdminData();
                        setShowModal(null);
                        setSavingForm({ memberId: '', pokok: 0, wajib: 0, sukarela: 0, cicilan: 0 });
                    } else setAlertMessage(error.message);
                }
            };

            const handleAddExpense = async (e) => {
                e.preventDefault();
                if (!expenseForm.category || !expenseForm.amount) return setAlertMessage("Data pengeluaran tidak lengkap.");
                
                const { error } = await supabase.from('expenses').insert([{
                    category: expenseForm.category,
                    amount: expenseForm.amount,
                    notes: expenseForm.notes,
                    date: new Date().toISOString().split('T')[0]
                }]);
                
                if (!error) {
                    fetchAdminData();
                    setShowModal(null);
                    setExpenseForm({ category: '', amount: '', notes: '' });
                    setAlertMessage("Pengeluaran beban berhasil dicatat.");
                } else {
                    setAlertMessage(`Gagal: ${error.message}`);
                }
            };

            const calculateKredit = () => {
                const principal = Number(kreditForm.amount) || 0;
                const totalMargin = principal * (Number(kreditForm.marginPercent) / 100) * Number(kreditForm.tenor);
                const total = principal + totalMargin;
                const monthly = total / (Number(kreditForm.tenor) * 12);
                return { total, monthly: isFinite(monthly) ? monthly : 0 };
            };

            const handleAddKredit = async () => {
                const newId = `KRD-${Math.random().toString(36).substr(2,4).toUpperCase()}`;
                const { error } = await supabase.from('financings').insert([{
                    id: newId,
                    member_id: kreditForm.memberId,
                    title: kreditForm.title,
                    amount: kreditForm.amount,
                    margin_percent: kreditForm.marginPercent,
                    tenor: kreditForm.tenor,
                    monthly: calculateKredit().monthly,
                    date: new Date().toISOString().split('T')[0]
                }]);
                if (!error) {
                    if (kreditForm.requestId) {
                        await supabase.from('requests').update({ status: 'Disetujui' }).eq('id', kreditForm.requestId);
                    }
                    fetchAdminData();
                    setShowModal(null);
                    setKreditForm({ memberId: '', title: '', amount: 0, marginPercent: 5, tenor: 1, requestId: null });
                } else setAlertMessage(error.message);
            };

            const handleSubmitRequest = async (e) => {
                e.preventDefault();
                if (!requestForm.amount || requestForm.amount <= 0) return setAlertMessage("Nominal pengajuan tidak valid.");
                
                if (requestForm.type === 'Penarikan' && myData.sukarela < requestForm.amount) {
                    return setAlertMessage(`Pengajuan Gagal: Saldo Tabungan Sukarela Anda (${formatIDR(myData.sukarela)}) tidak mencukupi untuk nominal penarikan ini.`);
                }

                const { error } = await supabase.from('requests').insert([{
                    member_id: myProfile.id,
                    type: requestForm.type,
                    amount: requestForm.amount,
                    tenor: requestForm.type === 'Kredit' ? requestForm.tenor : null,
                    notes: requestForm.notes,
                    status: 'Menunggu',
                    date: new Date().toISOString().split('T')[0]
                }]);

                if (!error) {
                    setAlertMessage("Pengajuan berhasil dikirim dan sedang menunggu persetujuan pengurus.");
                    setRequestForm({ type: 'Kredit', amount: '', tenor: 1, notes: '' });
                    fetchMemberData(session.user.email);
                } else setAlertMessage(`Gagal Mengirim: ${error.message}`);
            };

            const handleApproveRequest = async (req) => {
                if (req.type === 'Penarikan') {
                    const confirmMsg = `Setujui penarikan Rp${formatIDR(req.amount)} untuk ${members.find(m => m.id === req.member_id)?.name}?`;
                    
                    setConfirmAction({
                        message: confirmMsg,
                        onConfirm: async () => {
                            const memberData = memberFinancialData.find(m => m.id === req.member_id);
                            if (memberData.sukarela < req.amount) {
                                return setAlertMessage("Gagal Disetujui: Saldo tabungan sukarela anggota sudah tidak mencukupi.");
                            }

                            const { error: saveErr } = await supabase.from('savings').insert([{
                                member_id: req.member_id, type: 'Sukarela', amount: -Math.abs(req.amount), date: new Date().toISOString().split('T')[0], notes: 'Penarikan Disetujui'
                            }]);

                            if (!saveErr) {
                                await supabase.from('requests').update({ status: 'Disetujui' }).eq('id', req.id);
                                fetchAdminData();
                            } else setAlertMessage(saveErr.message);
                        }
                    });

                } else if (req.type === 'Kredit') {
                    setKreditForm({
                        memberId: req.member_id, title: req.notes || 'Pengajuan Kredit', amount: req.amount, marginPercent: 5, tenor: req.tenor || 1, requestId: req.id
                    });
                    setShowModal('kredit');
                }
            };

            const handleRejectRequest = async (reqId) => {
                setConfirmAction({
                    message: "Yakin ingin menolak pengajuan ini?",
                    onConfirm: async () => {
                        const { error } = await supabase.from('requests').update({ status: 'Ditolak' }).eq('id', reqId);
                        if (!error) fetchAdminData();
                    }
                });
            };

            // ==========================================
            // 9. MENU & STRUKTUR UI PORTAL
            // ==========================================
            const adminMenu = [
                { id: 'dashboard', icon: 'dashboard', label: 'Dashboard' },
                { id: 'pengajuan', icon: 'bell', label: 'Pengajuan', badge: pendingRequestsCount },
                { id: 'anggota', icon: 'users', label: 'Anggota' },
                { id: 'kas', icon: 'wallet', label: 'Setoran Kas' },
                { id: 'kredit', icon: 'kredit', label: 'Kredit' },
                { id: 'pengeluaran', icon: 'receipt', label: 'Pengeluaran' },
                { id: 'laporan', icon: 'file', label: 'Laporan Keuangan' },
                { id: 'shu', icon: 'shu', label: 'Distribusi SHU' },
                { id: 'pengaturan', icon: 'settings', label: 'Pengaturan' }
            ];

            const memberMenu = [
                { id: 'member_dashboard', icon: 'dashboard', label: 'Ringkasan' },
                { id: 'member_pengajuan', icon: 'send', label: 'Pengajuan Layanan' },
                { id: 'member_kas', icon: 'wallet', label: 'Tabungan Saya' },
                { id: 'member_shu', icon: 'shu', label: 'Estimasi SHU' },
            ];

            const menuToRender = isAdmin ? adminMenu : memberMenu;

            return (
                <div className="flex h-screen overflow-hidden bg-slate-50">
                    {/* SIDEBAR */}
                    <aside className={`print-hide fixed inset-y-0 left-0 w-64 bg-white border-r border-slate-200 p-6 z-50 transition-transform md:relative md:translate-x-0 flex flex-col ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="flex items-center justify-between mb-8 px-2">
                            <div className="flex items-center space-x-3">
                                <div className="w-12 h-12 bg-white rounded-xl flex items-center justify-center shadow-lg shadow-emerald-200 overflow-hidden border border-slate-100 shrink-0">
                                    <img src={coopLogo} alt="Logo" className="w-full h-full object-contain p-1" />
                                </div>
                                {renderCoopName()}
                            </div>
                            <button className="md:hidden text-slate-500" onClick={() => setIsSidebarOpen(false)}><Icon name="x" /></button>
                        </div>
                        
                        <div className="mb-6 p-4 bg-emerald-50 rounded-2xl border border-emerald-100">
                            <p className="text-[10px] font-black text-emerald-800 uppercase mb-1">Login Sebagai</p>
                            <p className="font-bold text-sm text-slate-700 truncate">{isAdmin ? 'Administrator' : (myProfile?.name || 'Anggota')}</p>
                            <p className="text-[10px] text-slate-500 truncate">{session?.user?.email}</p>
                        </div>
