                                                            <th className="px-4 py-3 text-right">Jasa Simpanan (20%)</th>
                                                            <th className="px-4 py-3 text-right">Jasa Anggota (30%)</th>
                                                            <th className="px-4 py-3 text-right bg-emerald-50 text-emerald-800">Total Diterima</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-100">
                                                        {memberFinancialData.map(m => {
                                                            const jasaSimpanan = totalCoopSavings > 0 ? (m.totalSavings / totalCoopSavings) * (Math.max(0, labaBersih) * 0.20) : 0;
                                                            const jasaAnggota = totalPendapatan > 0 ? (m.actualMarginPaid / totalPendapatan) * (Math.max(0, labaBersih) * 0.30) : 0;
                                                            const totalTerima = jasaSimpanan + jasaAnggota;
                                                            return (
                                                                <tr key={m.id} className="hover:bg-slate-50 text-sm">
                                                                    <td className="px-4 py-3 font-bold text-slate-700">{m.name} <span className="block text-[10px] text-slate-400 font-mono font-normal">{m.id}</span></td>
                                                                    <td className="px-4 py-3 text-right font-mono text-slate-500">{formatIDR(jasaSimpanan)}</td>
                                                                    <td className="px-4 py-3 text-right font-mono text-slate-500">{formatIDR(jasaAnggota)}</td>
                                                                    <td className="px-4 py-3 text-right font-black text-emerald-700 bg-emerald-50/30">{formatIDR(totalTerima)}</td>
                                                                </tr>
                                                            );
                                                        })}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* --- TAB: SHU MEMBER --- */}
                            {activeTab === 'member_shu' && !isAdmin && myProfile && (
                                <div className="space-y-6 animate-fade-in">
                                    <div className="bg-white rounded-3xl border shadow-sm p-6 md:p-8">
                                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                                            <div>
                                                <h4 className="font-black text-2xl text-slate-800">Estimasi SHU Anda</h4>
                                                <p className="text-sm text-slate-500 mt-1">Proyeksi pembagian Laba Bersih yang disinkronisasi secara real-time</p>
                                            </div>
                                            <div className="bg-emerald-50 p-4 rounded-2xl border border-emerald-100 text-right">
                                                <p className="text-[10px] font-black text-emerald-700 uppercase tracking-widest">Estimasi Total Diterima</p>
                                                <p className="text-3xl font-black text-emerald-700">
                                                    {formatIDR(
                                                        (totalCoopSavings > 0 ? (myData.totalSavings / totalCoopSavings) * (Math.max(0, labaBersih) * 0.20) : 0) + 
                                                        (totalPendapatan > 0 ? (myData.actualMarginPaid / totalPendapatan) * (Math.max(0, labaBersih) * 0.30) : 0)
                                                    )}
                                                </p>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                                            <div className="bg-amber-50 p-6 rounded-3xl border border-amber-100 relative overflow-hidden">
                                                <div className="absolute -right-4 -bottom-4 opacity-10 text-amber-500"><Icon name="wallet" size={120}/></div>
                                                <h5 className="font-black text-amber-800 mb-2">Dari Jasa Simpanan (20%)</h5>
                                                <p className="text-sm text-amber-700 mb-6 relative z-10">Dibagikan sebanding dengan proporsi total simpanan Anda terhadap keseluruhan kas simpanan Koperasi.</p>
                                                <div className="text-3xl font-black text-amber-600 relative z-10">
                                                    {formatIDR(totalCoopSavings > 0 ? (myData.totalSavings / totalCoopSavings) * (Math.max(0, labaBersih) * 0.20) : 0)}
                                                </div>
                                            </div>
                                            <div className="bg-emerald-50 p-6 rounded-3xl border border-emerald-100 relative overflow-hidden">
                                                <div className="absolute -right-4 -bottom-4 opacity-10 text-emerald-600"><Icon name="kredit" size={120}/></div>
                                                <h5 className="font-black text-emerald-800 mb-2">Dari Jasa Anggota (30%)</h5>
                                                <p className="text-sm text-emerald-700 mb-6 relative z-10">Dibagikan berdasarkan persentase kontribusi bayar margin/kredit Anda kepada Koperasi.</p>
                                                <div className="text-3xl font-black text-emerald-600 relative z-10">
                                                    {formatIDR(totalPendapatan > 0 ? (myData.actualMarginPaid / totalPendapatan) * (Math.max(0, labaBersih) * 0.30) : 0)}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>

                    {/* MODAL SIMPANAN (ADMIN) */}
                    {showModal === 'saving' && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 print-hide">
                            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={() => setShowModal(null)}></div>
                            <div className="bg-white rounded-[32px] w-full max-w-lg relative overflow-hidden shadow-2xl animate-fade-in">
                                <div className="p-6 bg-emerald-800 text-amber-400 flex justify-between items-center">
                                    <h3 className="font-black uppercase text-sm tracking-wider">Input Setoran Kas</h3>
                                    <button onClick={() => setShowModal(null)} className="hover:rotate-90 transition-transform"><Icon name="x" /></button>
                                </div>
                                <div className="p-8 space-y-5">
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Pilih Anggota</label>
                                        <select className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none focus:border-emerald-600" onChange={(e)=>setSavingForm({...savingForm, memberId: e.target.value})}>
                                            <option value="">-- Pilih Anggota --</option>
                                            {members.map(m => <option key={m.id} value={m.id}>{m.name} ({m.id})</option>)}
                                        </select>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Simpanan Pokok (Rp)</label>
                                            <input type="number" className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none focus:border-emerald-600" value={savingForm.pokok || ''} onChange={(e)=>setSavingForm({...savingForm, pokok: Number(e.target.value)})}/>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Simpanan Wajib (Rp)</label>
                                            <input type="number" className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none focus:border-emerald-600" value={savingForm.wajib || ''} onChange={(e)=>setSavingForm({...savingForm, wajib: Number(e.target.value)})}/>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Simpanan Sukarela (Rp)</label>
                                            <input type="number" className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none focus:border-emerald-600" value={savingForm.sukarela || ''} onChange={(e)=>setSavingForm({...savingForm, sukarela: Number(e.target.value)})}/>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Setoran Cicilan (Rp)</label>
                                            <input type="number" className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none focus:border-emerald-600" value={savingForm.cicilan || ''} onChange={(e)=>setSavingForm({...savingForm, cicilan: Number(e.target.value)})}/>
                                        </div>
                                    </div>
                                    
                                    <div className="p-6 bg-emerald-50 rounded-2xl border border-emerald-100 flex justify-between items-center mt-6">
                                        <p className="text-[10px] font-black uppercase text-emerald-800">Total Masuk</p>
                                        <p className="text-2xl font-black text-emerald-700">{formatIDR(Number(savingForm.pokok) + Number(savingForm.wajib) + Number(savingForm.sukarela) + Number(savingForm.cicilan))}</p>
                                    </div>
                                    <button onClick={handleAddSaving} disabled={!savingForm.memberId} className="w-full bg-emerald-800 hover:bg-emerald-900 disabled:bg-slate-300 text-amber-400 py-4 rounded-xl font-black shadow-lg transition-colors mt-4">SIMPAN TRANSAKSI</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL PENGELUARAN (ADMIN) */}
                    {showModal === 'expense' && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 print-hide">
                            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={() => setShowModal(null)}></div>
                            <div className="bg-white rounded-[32px] w-full max-w-lg relative overflow-hidden shadow-2xl animate-fade-in flex flex-col max-h-[90vh]">
                                <div className="p-6 bg-red-600 text-white flex justify-between items-center shrink-0">
                                    <h3 className="font-black uppercase text-sm tracking-wider">Catat Pengeluaran Beban</h3>
                                    <button onClick={() => setShowModal(null)} className="hover:rotate-90 transition-transform"><Icon name="x" /></button>
                                </div>
                                <div className="p-8 space-y-5 overflow-y-auto custom-scrollbar">
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Pilih Kategori Beban</label>
                                        <select className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none focus:border-red-500" value={expenseForm.category} onChange={(e)=>setExpenseForm({...expenseForm, category: e.target.value})}>
                                            <option value="">-- Pilih Kategori --</option>
                                            {EXPENSE_CATEGORIES.map(group => (
                                                <optgroup key={group.group} label={group.group} className="font-black text-gray-400">
                                                    {group.items.map(item => <option key={item} value={item} className="font-medium text-slate-700">{item}</option>)}
                                                </optgroup>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Nominal Pengeluaran (Rp)</label>
                                        <input type="number" className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none focus:border-red-500" value={expenseForm.amount} onChange={(e)=>setExpenseForm({...expenseForm, amount: Number(e.target.value)})}/>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Catatan Tambahan (Opsional)</label>
                                        <input type="text" placeholder="Misal: Tagihan PLN Bulan Juli" className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none focus:border-red-500" value={expenseForm.notes} onChange={(e)=>setExpenseForm({...expenseForm, notes: e.target.value})}/>
                                    </div>
                                    <button onClick={handleAddExpense} disabled={!expenseForm.category || !expenseForm.amount} className="w-full bg-red-600 hover:bg-red-700 disabled:bg-slate-300 text-white py-4 rounded-xl font-black shadow-lg transition-colors mt-4">SIMPAN PENGELUARAN</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL KREDIT (ADMIN) */}
                    {showModal === 'kredit' && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 print-hide">
                            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={() => setShowModal(null)}></div>
                            <div className="bg-white rounded-[32px] w-full max-w-lg relative overflow-hidden shadow-2xl animate-fade-in flex flex-col max-h-[90vh]">
                                <div className="p-6 bg-amber-500 text-emerald-900 flex justify-between items-center shrink-0">
                                    <h3 className="font-black uppercase text-sm tracking-wider">Akad Kredit Baru</h3>
                                    <button onClick={() => setShowModal(null)} className="hover:rotate-90 transition-transform"><Icon name="x" /></button>
                                </div>
                                <div className="p-8 space-y-5 overflow-y-auto custom-scrollbar">
                                    {kreditForm.requestId && (
                                        <div className="p-3 mb-2 bg-amber-50 text-amber-700 text-xs font-bold rounded-xl border border-amber-100 flex items-center gap-2">
                                            <Icon name="bell" size={16}/> Formulir Pra-isi dari Pengajuan Anggota
                                        </div>
                                    )}
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Pilih Anggota</label>
                                        <select className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none focus:border-amber-500" value={kreditForm.memberId} onChange={(e)=>setKreditForm({...kreditForm, memberId: e.target.value})}>
                                            <option value="">-- Pilih Anggota --</option>
                                            {members.map(m => <option key={m.id} value={m.id}>{m.name} ({m.id})</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Keterangan / Tujuan</label>
                                        <input type="text" placeholder="Misal: Modal Usaha" className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none focus:border-amber-500" value={kreditForm.title} onChange={(e)=>setKreditForm({...kreditForm, title: e.target.value})}/>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Plafon Pinjaman (Rp)</label>
                                            <input type="number" className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none focus:border-amber-500" value={kreditForm.amount} onChange={(e)=>setKreditForm({...kreditForm, amount: Number(e.target.value)})}/>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Margin Keuntungan (%)</label>
                                            <input type="number" step="0.1" className="w-full p-4 bg-slate-50 rounded-xl border font-bold text-slate-700 outline-none focus:border-amber-500" value={kreditForm.marginPercent} onChange={(e)=>setKreditForm({...kreditForm, marginPercent: Number(e.target.value)})}/>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Tenor Pembiayaan</label>
                                        <div className="flex gap-2">
                                            {[1, 2, 3].map(t => (
                                                <button key={t} onClick={() => setKreditForm({...kreditForm, tenor: t})} className={`flex-1 py-3 rounded-xl border font-black transition-colors ${kreditForm.tenor === t ? 'border-amber-500 bg-amber-50 text-amber-600' : 'border-slate-200 text-slate-400 hover:bg-slate-50'}`}>{t} Tahun</button>
                                            ))}
                                        </div>
                                    </div>
                                    
                                    <div className="p-6 bg-emerald-900 rounded-2xl flex justify-between items-end mt-6 shadow-lg border border-emerald-800">
                                        <div>
                                            <p className="text-[10px] font-black uppercase text-emerald-400 mb-1">Estimasi Cicilan / Bln</p>
                                            <p className="text-2xl font-black text-amber-400">{formatIDR(calculateKredit().monthly)}</p>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-[8px] font-black uppercase text-emerald-300 mb-1">Total Pengembalian</p>
                                            <p className="text-sm font-bold text-emerald-100">{formatIDR(calculateKredit().total)}</p>
                                        </div>
                                    </div>
                                    <button onClick={handleAddKredit} disabled={!kreditForm.memberId || !kreditForm.amount || !kreditForm.title} className="w-full bg-amber-500 hover:bg-amber-600 disabled:bg-slate-300 text-emerald-900 py-4 rounded-xl font-black shadow-lg transition-colors mt-4">KIRIM PENGAJUAN</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL CETAK ID CARD */}
                    {printMember && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm print-bg-white print-hide">
                            <div className="bg-white rounded-[32px] w-full max-w-lg overflow-hidden shadow-2xl animate-fade-in flex flex-col print-no-shadow">
                                <div className="p-6 bg-emerald-800 text-amber-400 flex justify-between items-center print-hide">
                                    <h3 className="font-black uppercase text-sm tracking-wider flex items-center gap-2"><Icon name="print"/> Cetak ID Card</h3>
                                    <button onClick={() => setPrintMember(null)} className="hover:rotate-90 transition-transform"><Icon name="x" /></button>
                                </div>
                                
                                <div className="p-8 flex flex-col items-center justify-center bg-slate-100 print-p-0 print-bg-white">
                                    <p className="text-xs text-slate-500 mb-6 text-center print-hide">
                                        Kartu ini berukuran standar CR80 (86mm x 54mm). Anda bisa mencetaknya di kertas PVC ID Card menggunakan Printer ID khusus, atau mencetaknya secara masal di kertas A4.
                                    </p>

                                    {/* --- KANVAS KARTU ANGGOTA --- */}
                                    <div className="id-card flex items-center justify-center w-full relative">
                                        <div 
                                            id="id-card-element"
                                            className="bg-gradient-to-br from-emerald-900 to-[#022c22] rounded-xl shadow-xl overflow-hidden relative text-white flex box-border shrink-0" 
                                            style={{ width: '86mm', height: '54mm', padding: '4mm' }}
                                        >
                                            {/* Efek Latar Belakang */}
                                            <div className="absolute -right-8 -top-8 opacity-[0.08] text-amber-500"><Icon name="shu" size={130}/></div>
                                            <div className="absolute left-0 bottom-0 w-full h-1/3 bg-gradient-to-t from-amber-500/20 to-transparent"></div>

                                            {/* WATERMARK LOGO DI TENGAH */}
                                            <div className="absolute inset-0 flex items-center justify-center z-0 opacity-[0.10] pointer-events-none select-none">
                                                <img src={coopLogo} alt="Watermark" className="w-[45mm] h-[45mm] object-contain grayscale" />
                                            </div>

                                            <div className="w-[30%] flex flex-col items-center justify-between border-r border-amber-500/20 pr-[4mm] relative z-10 h-full">
                                                <div className="w-full aspect-[3/4] bg-white/10 rounded overflow-hidden border border-amber-500/30 flex items-center justify-center">
                                                    {printMember.photo_url ? (
                                                        <img src={printMember.photo_url} className="w-full h-full object-cover" onError={(e) => { e.target.onerror = null; e.target.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(printMember.name)}&background=047857&color=fbbf24`; }}/>
                                                    ) : (
                                                        <Icon name="user" size={24} className="text-amber-400/50"/>
                                                    )}
                                                </div>
                                                <div className="bg-white p-[2mm] rounded mt-[2mm] shrink-0 w-full aspect-square flex items-center justify-center">
                                                    <img src={`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${printMember.id}`} className="w-full h-full object-contain mix-blend-multiply" alt="QR Code"/>
                                                </div>
                                            </div>

                                            <div className="w-[70%] pl-[4mm] flex flex-col relative z-10 h-full">
                                                <div className="flex items-center gap-2 mb-1">
                                                    <div className="w-6 h-6 bg-white rounded flex items-center justify-center shadow-md shadow-amber-500/50 overflow-hidden shrink-0">
                                                        <img src={coopLogo} alt="Logo" className="w-full h-full object-contain p-0.5" />
                                                    </div>
                                                    <h2 className="text-[10px] font-black uppercase tracking-widest text-amber-400">{coopName}</h2>
                                                </div>
                                                <div className="w-full h-[1px] bg-amber-500/20 mb-3 mt-1"></div>

                                                <h3 className="text-[14px] font-black leading-normal uppercase pb-1" style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{printMember.name}</h3>
                                                <p className="text-[10px] font-mono text-emerald-200 mb-auto">{printMember.id}</p>

                                                <div className="space-y-[2mm] mt-2 w-full">
                                                    <div>
                                                        <p className="text-[6px] text-amber-200/80 uppercase tracking-widest leading-none mb-0.5">NIK (Kependudukan)</p>
                                                        <p className="text-[9px] font-bold font-mono tracking-wider leading-none text-white">{printMember.nik}</p>
                                                    </div>
                                                    <div className="flex justify-between items-end">
                                                        <div>
                                                            <p className="text-[6px] text-amber-200/80 uppercase tracking-widest leading-none mb-0.5">Tgl. Bergabung</p>
                                                            <p className="text-[8px] font-bold leading-none text-white">{printMember.join_date}</p>
                                                        </div>
                                                        <div className="text-right">
                                                            <p className="text-[6px] text-amber-200/80 uppercase tracking-widest leading-none mb-0.5">Status Anggota</p>
                                                            <p className="text-[8px] font-black text-amber-400 uppercase leading-none">{printMember.status}</p>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <button onClick={handleDownloadIDCard} className="mt-8 bg-emerald-800 hover:bg-emerald-900 text-amber-400 px-8 py-4 rounded-xl font-black shadow-lg flex items-center gap-3 transition-colors print-hide">
                                        <Icon name="download" size={24}/> DOWNLOAD KARTU (PNG)
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CUSTOM ALERT MODAL */}
                    {alertMessage && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in print-hide">
                            <div className="bg-white p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl border border-slate-100">
                                <div className="w-16 h-16 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="bell" size={30}/></div>
                                <p className="font-black text-slate-800 mb-6 text-sm">{alertMessage}</p>
                                <button onClick={() => setAlertMessage(null)} className="bg-emerald-800 hover:bg-emerald-900 transition-colors text-amber-400 px-6 py-3 rounded-xl font-black w-full shadow-lg shadow-emerald-200">Oke, Mengerti</button>
                            </div>
                        </div>
                    )}

                    {/* CUSTOM CONFIRM MODAL */}
                    {confirmAction && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in print-hide">
                            <div className="bg-white p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl border border-slate-100">
                                <div className="w-16 h-16 bg-orange-50 text-orange-500 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="bell" size={30}/></div>
                                <p className="font-black text-slate-800 mb-6 text-sm">{confirmAction.message}</p>
                                <div className="flex gap-4">
                                    <button onClick={() => setConfirmAction(null)} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-3 rounded-xl font-black transition-colors">Batal</button>
                                    <button onClick={() => { confirmAction.onConfirm(); setConfirmAction(null); }} className="flex-1 bg-emerald-800 hover:bg-emerald-900 text-amber-400 px-4 py-3 rounded-xl font-black transition-colors shadow-lg shadow-emerald-200">Ya, Lanjutkan</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
